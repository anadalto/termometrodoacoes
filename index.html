<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Termômetro de Doação</title>


<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;
}


body {

    overflow-x: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   V9 — DESKTOP
   Mantém a versão que aprovamos.
   ========================================================= */

.pagina {

    position: relative;

    width: min(100vw, 1600px);

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;


    /*
       IMPORTANTE:

       V5-BASE.png precisa estar na mesma
       pasta do index.html.
    */

    background-image: url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: 100% 100%;
}


/* =========================================================
   GRÁFICO
   ========================================================= */

.grafico {

    position: absolute;

    /*
       Posição horizontal.
       O cachorro está à esquerda,
       então o gráfico fica na área clara.
    */

    left: 66%;


    /*
       Posição vertical.
    */

    top: 53%;


    /*
       Tamanho do gráfico.
    */

    width: 30%;

    aspect-ratio: 1 / 1;


    /*
       Centraliza o próprio gráfico
       no ponto definido acima.
    */

    transform:
        translate(-50%, -50%);


    display: flex;

    align-items: center;

    justify-content: center;


    z-index: 20;
}


/* =========================================================
   CÍRCULO
   ========================================================= */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;


    /*
       O JavaScript controla
       o percentual preenchido.
    */

    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg
        );


    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);
}


/* =========================================================
   PARTE INTERNA DO CÍRCULO
   ========================================================= */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;
}


/* =========================================================
   CONTEÚDO DO GRÁFICO
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================================================
   PERCENTUAL
   ========================================================= */

.percentual {

    color: #005238;


    /*
       O tamanho acompanha a tela.
    */

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );


    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   "DA NOSSA META"
   ========================================================= */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );


    color: #d95f02;


    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );


    line-height: 1;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) and (min-width: 601px) {

    .grafico {

        left: 66%;

        top: 53%;

        width: 31%;
    }


    .percentual {

        font-size: 5vw;
    }


    .subtitulo {

        font-size: 1.7vw;
    }
}


/* =========================================================
   CELULAR
   ========================================================= */

@media (max-width: 600px) {

    html,
    body {

        width: 100%;

        min-height: 100%;

        background: #f7f2e9;
    }


    body {

        overflow-x: hidden;

        overflow-y: auto;
    }


    .pagina {

        width: 100vw;


        /*
           Mantemos a proporção 16:9.

           Isso evita que o cachorro
           fique achatado.
        */

        aspect-ratio: 16 / 9;

        min-height: 0;


        background-size: 100% 100%;

        background-position: center center;
    }


    /*
       Gráfico um pouco maior no celular
       para continuar fácil de enxergar.
    */

    .grafico {

        left: 66%;

        top: 53%;

        width: 31%;


        transform:
            translate(-50%, -50%);
    }


    /*
       Texto do gráfico.
    */

    .percentual {

        font-size: 6vw;

        line-height: 0.95;
    }


    .subtitulo {

        margin-top: 1.4vw;

        font-size: 1.9vw;
    }
}


/* =========================================================
   CELULARES MUITO PEQUENOS
   ========================================================= */

@media (max-width: 380px) {

    .grafico {

        left: 66%;

        top: 53%;

        width: 32%;
    }


    .percentual {

        font-size: 6.3vw;
    }


    .subtitulo {

        font-size: 2vw;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     PÁGINA
     ======================================================= -->

<main class="pagina">


    <!-- ===================================================
         GRÁFICO DINÂMICO
         =================================================== -->

    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <!-- CÍRCULO -->

        <div
            class="circulo"
            id="circulo"
        ></div>


        <!-- TEXTO DO GRÁFICO -->

        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>

    </section>


</main>


<script>

/* =========================================================
   ATUALIZAÇÃO DA CAMPANHA
   =========================================================

   MUDE SOMENTE ESTE NÚMERO.

   Exemplo:

   118 = 118 kg arrecadados

   250 = 250 kg arrecadados

   500 = 500 kg arrecadados

   1000 = meta atingida
   ========================================================= */


const arrecadado = 118;


const meta = 1000;


/* =========================================================
   CÁLCULO DO PERCENTUAL
   ========================================================= */

let percentual =
    (arrecadado / meta) * 100;


/*
   Impede que o gráfico ultrapasse 100%.
*/

percentual =
    Math.max(
        0,
        Math.min(
            percentual,
            100
        )
    );


/* =========================================================
   LOCALIZA OS ELEMENTOS
   ========================================================= */

const percentualElemento =
    document.getElementById(
        "percentual"
    );


const circulo =
    document.getElementById(
        "circulo"
    );


/* =========================================================
   MOSTRA O PERCENTUAL
   =========================================================

   Exemplo:

   11.8

   vira:

   11,8%
   */

percentualElemento.textContent =

    percentual.toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    ) + "%";


/* =========================================================
   PREENCHIMENTO DO CÍRCULO
   =========================================================

   100% = 360 graus

   Portanto:

   11,8% = 42,48 graus
   */

const graus =
    percentual * 3.6;


circulo.style.setProperty(

    "--progresso",

    graus + "deg"

);

</script>


</body>

</html>
