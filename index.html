<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Termômetro de Doação</title>


    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;

            background: #f7f3eb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            overflow-x: hidden;
        }


        /* =====================================================
           PÁGINA
           ===================================================== */

        .page {

            position: relative;

            width: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #f7f3eb;
        }


        /* =====================================================
           IMAGEM DESKTOP
           ===================================================== */

        .background {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            z-index: 1;
        }


        /* =====================================================
           ÁREA DO GRÁFICO
           ===================================================== */

        .chart-area {

            position: absolute;

            z-index: 20;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* =====================================================
           GRÁFICO
           ===================================================== */

        .progress-ring {

            position: relative;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                conic-gradient(
                    #005c3b 0deg,
                    #005c3b var(--progress-angle),
                    #e5dfd3 var(--progress-angle),
                    #e5dfd3 360deg
                );

            box-shadow:
                0 8px 25px rgba(60, 50, 40, 0.12);
        }


        /* =====================================================
           PARTE INTERNA
           ===================================================== */

        .progress-ring::before {

            content: "";

            position: absolute;

            width: 82%;
            height: 82%;

            border-radius: 50%;

            background: #f7f3eb;
        }


        /* =====================================================
           CONTEÚDO INTERNO
           ===================================================== */

        .progress-content {

            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            line-height: 1;
        }


        /* =====================================================
           PERCENTUAL
           ===================================================== */

        .percent {

            font-size: 70px;

            font-weight: 900;

            color: #005c3b;

            line-height: 1;

            letter-spacing: -2px;
        }


        /* =====================================================
           TEXTO DA META
           ===================================================== */

        .percent-label {

            margin-top: 18px;

            font-size: 24px;

            font-weight: 800;

            color: #d95f00;

            line-height: 1.1;

            text-transform: uppercase;
        }


        /* =====================================================
           =====================================================
           DESKTOP
           =====================================================
           ===================================================== */

        @media (min-width: 601px) {


            /*
               A arte desktop possui:
               1536 x 1024
            */

            .page {

                width: 100%;

                aspect-ratio: 1536 / 1024;

                height: auto;

                min-height: 0;

                position: relative;

                overflow: hidden;
            }


            /*
               ARTE DESKTOP
            */

            .background {

                display: block;

                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                object-fit: fill;

                object-position: center;

                z-index: 1;
            }


            /*
               =================================================
               GRÁFICO DESKTOP
               =================================================

               Mantemos a posição da versão que funcionou
               no desktop.

               O gráfico fica centralizado dentro da área
               livre da arte.
            */

            .chart-area {

                width: 40vw;
                height: 40vw;

                max-width: 430px;
                max-height: 430px;

                left: 68%;

                top: 50%;

                transform:
                    translate(-50%, -50%);
            }


            /*
               TAMANHO DO GRÁFICO
            */

            .progress-ring {

                width: min(28vw, 430px);

                height: min(28vw, 430px);
            }


            /*
               PERCENTUAL
               Sempre proporcional ao gráfico
            */

            .percent {

                font-size:
                    clamp(
                        55px,
                        5vw,
                        82px
                    );
            }


            /*
               TEXTO DA META
               Sempre proporcional ao gráfico
            */

            .percent-label {

                margin-top: 4%;

                font-size:
                    clamp(
                        18px,
                        1.7vw,
                        27px
                    );
            }

        }


        /* =====================================================
           =====================================================
           CELULAR
           =====================================================
           ===================================================== */

        @media (max-width: 600px) {


            /*
               =================================================
               PÁGINA VERTICAL
               =================================================

               V5-CELULAR.png
               1536 x 2048
            */

            .page {

                width: 100%;

                aspect-ratio: 1536 / 2048;

                height: auto;

                min-height: 0;

                position: relative;

                overflow: hidden;

                background-color: #f7f3eb;

                background-image:
                    url("V5-CELULAR.png");

                background-repeat: no-repeat;

                background-position: center top;

                background-size: 100% 100%;
            }


            /*
               ESCONDE A ARTE DESKTOP
            */

            .background {

                display: none;
            }


            /*
               =================================================
               GRÁFICO MOBILE
               =================================================

               O espaço vazio da arte vertical fica
               principalmente abaixo do título.

               Por isso o gráfico é colocado mais para baixo.
            */

            .chart-area {

                position: absolute;

                width: 100%;

                height: auto;

                left: 50%;

                /*
                   POSIÇÃO VERTICAL DO GRÁFICO

                   68% = mais abaixo na arte
                */

                top: 68%;

                transform:
                    translate(-50%, -50%);

                display: flex;

                align-items: center;

                justify-content: center;

                z-index: 20;
            }


            /*
               =================================================
               TAMANHO DO GRÁFICO MOBILE
               =================================================

               O círculo usa a largura da tela.

               Assim ele diminui/aumenta junto com
               o celular.
            */

            .progress-ring {

                width: 42vw;

                height: 42vw;

                max-width: 250px;
                max-height: 250px;

                min-width: 150px;
                min-height: 150px;

                border-radius: 50%;

                display: flex;

                align-items: center;
                justify-content: center;

                background:
                    conic-gradient(
                        #005c3b 0deg,
                        #005c3b var(--progress-angle),
                        #e5dfd3 var(--progress-angle),
                        #e5dfd3 360deg
                    );

                box-shadow:
                    0 8px 25px
                    rgba(60, 50, 40, 0.12);
            }


            /*
               PARTE INTERNA
            */

            .progress-ring::before {

                content: "";

                position: absolute;

                width: 82%;
                height: 82%;

                border-radius: 50%;

                background: #f7f3eb;
            }


            /*
               CONTEÚDO
            */

            .progress-content {

                position: relative;

                z-index: 2;

                display: flex;

                flex-direction: column;

                align-items: center;
                justify-content: center;

                text-align: center;

                line-height: 1;
            }


            /*
               =================================================
               PERCENTUAL MOBILE
               =================================================

               Proporcional ao círculo.
            */

            .percent {

                font-size: 9vw;

                font-weight: 900;

                color: #005c3b;

                line-height: 1;

                letter-spacing: -1px;
            }


            /*
               =================================================
               TEXTO "DA NOSSA META"
               =================================================

               Também acompanha o tamanho do círculo.
            */

            .percent-label {

                margin-top: 4%;

                font-size: 3.2vw;

                font-weight: 800;

                color: #d95f00;

                line-height: 1.1;

                text-transform: uppercase;
            }

        }


        /* =====================================================
           CELULARES PEQUENOS
           ===================================================== */

        @media (max-width: 380px) {


            .chart-area {

                /*
                   Um pouco mais abaixo em telas pequenas
                */

                top: 69%;
            }


            .progress-ring {

                width: 43vw;
                height: 43vw;

                min-width: 145px;
                min-height: 145px;
            }


            .percent {

                font-size: 9vw;
            }


            .percent-label {

                font-size: 3.3vw;
            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         PÁGINA
         ===================================================== -->

    <div class="page">


        <!-- =================================================
             ARTE DESKTOP
             ================================================= -->

        <img
            class="background"
            src="V5-BASE.png"
            alt="Campanha de doação de ração"
        >


        <!-- =================================================
             GRÁFICO DINÂMICO
             ================================================= -->

        <div
            class="chart-area"
            id="chartArea"
        >

            <div
                class="progress-ring"
                id="progressRing"
            >

                <div
                    class="progress-content"
                >

                    <div
                        class="percent"
                        id="percent"
                    >
                        11,8%
                    </div>


                    <div
                        class="percent-label"
                    >
                        DA NOSSA META
                    </div>

                </div>

            </div>

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           DADOS DA CAMPANHA
           ===================================================== */


        /*
           =====================================================
           ALTERE SOMENTE ESTE NÚMERO
           =====================================================

           Atualmente:
           118 KG
        */

        const arrecadado = 118;


        /*
           META DA CAMPANHA
        */

        const meta = 1000;


        /* =====================================================
           CALCULA O PERCENTUAL
           ===================================================== */

        let percentual =
            (arrecadado / meta) * 100;


        /*
           Impede ultrapassar 100%
        */

        if (percentual > 100) {

            percentual = 100;

        }


        /*
           Evita valores negativos
        */

        if (percentual < 0) {

            percentual = 0;

        }


        /* =====================================================
           CALCULA O ÂNGULO
           ===================================================== */

        const angulo =
            percentual * 3.6;


        /* =====================================================
           PEGA O GRÁFICO
           ===================================================== */

        const progressRing =
            document.getElementById(
                "progressRing"
            );


        /* =====================================================
           APLICA O PREENCHIMENTO
           ===================================================== */

        progressRing.style.setProperty(
            "--progress-angle",
            angulo + "deg"
        );


        /* =====================================================
           ATUALIZA O PERCENTUAL
           ===================================================== */

        const percentElement =
            document.getElementById(
                "percent"
            );


        percentElement.textContent =
            percentual.toLocaleString(
                "pt-BR",
                {
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1
                }
            ) + "%";


    </script>


</body>

</html>
