<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Termômetro de Doação</title>


<style>


/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;

}


body {

    overflow-x: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}



/* =========================================================
   =========================================================
   DESKTOP
   V8 — NÃO ALTERAR
   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   PÁGINA DESKTOP
   --------------------------------------------------------- */

.pagina {

    position: relative;

    /*
       CORREÇÃO DESKTOP QUE FUNCIONOU.

       Mantém a arte em 16:9,
       mas impede que ela fique
       maior que a altura disponível.
    */

    width: min(
        100vw,
        1600px,
        calc(100vh * 16 / 9)
    );

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    background-image:
        url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: 100% 100%;
}



/* =========================================================
   GRÁFICO DESKTOP
   V8 — NÃO ALTERAR
   ========================================================= */

.grafico {

    position: absolute;

    left: 66%;

    top: 53%;

    width: 30%;

    aspect-ratio: 1 / 1;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 20;

}



/* ---------------------------------------------------------
   CÍRCULO DESKTOP
   --------------------------------------------------------- */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg

        );

    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);

}



/* ---------------------------------------------------------
   FURO DO CÍRCULO DESKTOP
   --------------------------------------------------------- */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;

}



/* =========================================================
   CONTEÚDO DO GRÁFICO DESKTOP
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}



/* ---------------------------------------------------------
   PERCENTUAL DESKTOP
   --------------------------------------------------------- */

.percentual {

    color: #005238;

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );

    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   SUBTÍTULO DESKTOP
   --------------------------------------------------------- */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );

    color: #d95f02;

    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );

    line-height: 1;

    font-weight: 900;

    white-space: nowrap;

}



/* =========================================================
   =========================================================
   MOBILE
   V13 — PRESERVADO
   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   PÁGINA MOBILE
   --------------------------------------------------------- */

.mobile-page {

    display: none;

    position: relative;

    width: 100vw;

    /*
       IMPORTANTE:

       A arte vertical é 9:16.

       Em vez de usar 100vh,
       calculamos a altura a partir da largura.

       Assim a proporção da arte não muda.
    */

    height: calc(100vw * 16 / 9);

    aspect-ratio: 9 / 16;

    overflow: hidden;

    background: #f5f0e7;

}



/* ---------------------------------------------------------
   ARTE VERTICAL MOBILE
   --------------------------------------------------------- */

.mobile-page > img {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    /*
       A imagem e a página têm
       exatamente a mesma proporção.

       Portanto não haverá corte.
    */

    object-fit: fill;

    display: block;

    z-index: 1;

}



/* =========================================================
   GRÁFICO MOBILE
   ========================================================= */

.chart-mobile {

    position: absolute;

    left: 50%;

    top: 43%;

    transform:
        translate(-50%, -50%);

    width: 43vw;

    max-width: 250px;

    aspect-ratio: 1 / 1;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}



/* ---------------------------------------------------------
   CÍRCULO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #00583f 0deg,

            #00583f var(--progress),

            #e4ddd1 var(--progress),

            #e4ddd1 360deg

        );

    box-shadow:
        0 12px 25px
        rgba(60, 45, 30, 0.10);

}



/* ---------------------------------------------------------
   FURO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-ring::after {

    content: "";

    position: absolute;

    width: 78%;

    height: 78%;

    left: 11%;

    top: 11%;

    border-radius: 50%;

    background: #f8f4ec;

}



/* ---------------------------------------------------------
   CONTEÚDO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-content {

    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}



/* ---------------------------------------------------------
   PERCENTUAL MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-percent {

    color: #00583f;

    font-size: 10vw;

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -0.04em;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   TEXTO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-label {

    margin-top: 3%;

    color: #d85b00;

    font-size: 4vw;

    line-height: 1;

    font-weight: 800;

    white-space: nowrap;

}



/* =========================================================
   =========================================================
   CONTROLE DESKTOP / MOBILE
   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   CELULAR
   --------------------------------------------------------- */

@media (max-width: 768px) {

    /*
       DESLIGA DESKTOP
    */

    .pagina {

        display: none;

    }


    /*
       LIGA MOBILE
    */

    .mobile-page {

        display: block;

    }

}



/* ---------------------------------------------------------
   DESKTOP
   --------------------------------------------------------- */

@media (min-width: 769px) {

    /*
       LIGA DESKTOP
    */

    .pagina {

        display: block;

    }


    /*
       DESLIGA MOBILE
    */

    .mobile-page {

        display: none;

    }

}



/* =========================================================
   TELAS MUITO PEQUENAS
   ========================================================= */

@media (max-width: 430px) {

    .chart-mobile {

        width: 48vw;

        top: 43%;

    }


    .chart-mobile .chart-percent {

        font-size: 11vw;

    }


    .chart-mobile .chart-label {

        font-size: 4.2vw;

    }

}



</style>

</head>


<body>



<!-- =======================================================
     DESKTOP
     ======================================================= -->

<main class="pagina">


    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <div
            class="circulo"
            id="circulo"
        ></div>


        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>


    </section>


</main>



<!-- =======================================================
     MOBILE
     ======================================================= -->

<div class="mobile-page">


    <!-- ===================================================
         ARTE VERTICAL
         =================================================== -->

    <img
        src="V5-CELULAR.png"

        alt="Campanha de doação de ração"
    >



    <!-- ===================================================
         GRÁFICO MOBILE
         =================================================== -->

    <div
        class="chart-mobile"
        id="chartMobile"
        style="--progress: 42.48deg;"
    >


        <div class="chart-ring"></div>


        <div class="chart-content">


            <div
                class="chart-percent"
                id="percentMobile"
            >
                11,8%
            </div>


            <div
                class="chart-label"
            >
                DA NOSSA META
            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */


/*
   ALTERE SOMENTE ESTE VALOR.

   Exemplo:

   118 KG
*/

const META = 1000;

let arrecadado = 118;



/* =========================================================
   ATUALIZA OS DOIS GRÁFICOS
   ========================================================= */

function atualizarGrafico() {


    /*
       Calcula percentual
    */

    let percentual =
        (arrecadado / META) * 100;


    /*
       Limita entre 0 e 100
    */

    percentual =
        Math.max(
            0,
            Math.min(
                percentual,
                100
            )
        );


    /*
       Converte percentual
       para graus do círculo
    */

    const graus =
        percentual * 3.6;


    /*
       Formatação brasileira
    */

    const percentualTexto =

        percentual.toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }
        ) + "%";



    /* =====================================================
       DESKTOP
       ===================================================== */

    const circulo =
        document.getElementById(
            "circulo"
        );


    const percentualElemento =
        document.getElementById(
            "percentual"
        );


    if (circulo) {

        circulo.style.setProperty(

            "--progresso",

            graus + "deg"

        );

    }


    if (percentualElemento) {

        percentualElemento.textContent =
            percentualTexto;

    }



    /* =====================================================
       MOBILE
       ===================================================== */

    const chartMobile =
        document.getElementById(
            "chartMobile"
        );


    const percentMobile =
        document.getElementById(
            "percentMobile"
        );


    if (chartMobile) {

        chartMobile.style.setProperty(

            "--progress",

            graus + "deg"

        );

    }


    if (percentMobile) {

        percentMobile.textContent =
            percentualTexto;

    }

}



/* =========================================================
   INICIALIZA
   ========================================================= */

atualizarGrafico();


</script>


</body>

</html>
