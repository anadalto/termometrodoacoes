<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Termômetro de Doação</title>


<style>

/* =========================================================
   V8 — TERMÔMETRO DE DOAÇÃO
   ========================================================= */


/* ---------------------------------------------------------
   CONFIGURAÇÕES GERAIS
   --------------------------------------------------------- */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;
}


body {

    overflow-x: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ---------------------------------------------------------
   PÁGINA
   --------------------------------------------------------- */

.pagina {

    position: relative;

    width: min(100vw, 1600px);

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;


    /*
       IMPORTANTE:

       O arquivo V5-BASE.png precisa estar
       na mesma pasta deste index.html.
    */

    background-image: url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: 100% 100%;
}


/* =========================================================
   GRÁFICO DINÂMICO
   ========================================================= */

.grafico {

    position: absolute;


    /*
       POSIÇÃO HORIZONTAL

       O cachorro ocupa a parte esquerda da imagem.

       66% coloca o centro do gráfico
       na região clara da arte.
    */

    left: 66%;


    /*
       POSIÇÃO VERTICAL

       53% deixa o gráfico centralizado
       visualmente na área disponível.
    */

    top: 53%;


    /*
       TAMANHO DO GRÁFICO
    */

    width: 30%;

    aspect-ratio: 1 / 1;


    /*
       Faz o próprio centro do gráfico
       ficar exatamente no ponto definido
       por left/top.
    */

    transform:
        translate(-50%, -50%);


    display: flex;

    align-items: center;

    justify-content: center;


    z-index: 20;
}


/* ---------------------------------------------------------
   CÍRCULO DO GRÁFICO
   --------------------------------------------------------- */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;


    /*
       O JavaScript controla automaticamente
       quantos graus serão preenchidos.
    */

    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg
        );


    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);
}


/* ---------------------------------------------------------
   PARTE INTERNA DO CÍRCULO
   --------------------------------------------------------- */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;
}


/* =========================================================
   TEXTO DO GRÁFICO
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* ---------------------------------------------------------
   PERCENTUAL
   --------------------------------------------------------- */

.percentual {

    color: #005238;


    /*
       O tamanho acompanha o tamanho da tela.

       Assim, se o gráfico aumentar,
       o número também aumenta.
    */

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );


    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;
}


/* ---------------------------------------------------------
   TEXTO "DA NOSSA META"
   --------------------------------------------------------- */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );


    color: #d95f02;


    /*
       Também fica proporcional
       ao tamanho do gráfico.
    */

    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );


    line-height: 1;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   RESPONSIVIDADE
   ========================================================= */

@media (max-width: 900px) {

    .grafico {

        left: 66%;

        top: 53%;

        width: 31%;
    }


    .percentual {

        font-size: 5vw;
    }


    .subtitulo {

        font-size: 1.7vw;
    }
}


@media (max-width: 600px) {

    .grafico {

        left: 66%;

        top: 53%;

        width: 32%;
    }


    .percentual {

        font-size: 5.5vw;
    }


    .subtitulo {

        font-size: 1.8vw;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     PÁGINA
     ======================================================= -->

<main class="pagina">


    <!-- ===================================================
         GRÁFICO DINÂMICO
         =================================================== -->

    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <!-- CÍRCULO -->

        <div
            class="circulo"
            id="circulo"
        ></div>


        <!-- TEXTOS -->

        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>

    </section>


</main>


<script>


/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */


/*
   ========================================================
   ALTERE SOMENTE ESTE NÚMERO
   ========================================================

   Aqui você coloca quantos KG já foram arrecadados.

   Atualmente:
   118 KG

   Meta:
   1.000 KG
   ========================================================
*/


const arrecadado = 118;


const meta = 1000;


/* =========================================================
   CÁLCULO DO PERCENTUAL
   ========================================================= */


let percentual =
    (arrecadado / meta) * 100;


/*
   Impede que o gráfico passe de 100%.
*/

percentual =
    Math.max(
        0,
        Math.min(
            percentual,
            100
        )
    );


/* =========================================================
   LOCALIZA OS ELEMENTOS
   ========================================================= */


const percentualElemento =
    document.getElementById(
        "percentual"
    );


const circulo =
    document.getElementById(
        "circulo"
    );


/* =========================================================
   ESCREVE O PERCENTUAL
   ========================================================= */


/*
   Usa o formato brasileiro.

   Exemplo:

   11.8

   vira

   11,8%
*/


percentualElemento.textContent =

    percentual.toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    ) + "%";


/* =========================================================
   CONVERTE % PARA GRAUS
   ========================================================= */


/*
   100% = 360 graus

   Portanto:

   11,8% = 42,48 graus
*/


const graus =
    percentual * 3.6;


/* =========================================================
   ATUALIZA O GRÁFICO
   ========================================================= */


circulo.style.setProperty(

    "--progresso",

    graus + "deg"

);


</script>


</body>

</html>
