<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Termômetro de Doação</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f5f0e7;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   DESKTOP
   ========================================================= */

.desktop-page {

    width: 100vw;

    /* mantém exatamente a proporção 16:9 */
    aspect-ratio: 16 / 9;

    position: relative;

    overflow: hidden;

    margin: 0 auto;

    background: #f5f0e7;
}


/* ---------------------------------------------------------
   IMAGEM BASE DESKTOP
   --------------------------------------------------------- */

.desktop-background {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    z-index: 1;
}


/* =========================================================
   GRÁFICO DESKTOP
   ========================================================= */

.chart-desktop {

    position: absolute;

    /*
       CENTRO DO GRÁFICO

       O gráfico fica na região clara da arte,
       aproximadamente no mesmo local da V8.
    */

    left: 74%;

    top: 55%;

    transform: translate(-50%, -50%);

    width: 28%;

    aspect-ratio: 1 / 1;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;
}


/* ---------------------------------------------------------
   CÍRCULO
   --------------------------------------------------------- */

.chart-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(
            #00583f 0deg,
            #00583f var(--progress),
            #e4ddd1 var(--progress),
            #e4ddd1 360deg
        );

    box-shadow:
        0 12px 25px rgba(60, 45, 30, 0.10);
}


/* ---------------------------------------------------------
   FURO DO CÍRCULO
   --------------------------------------------------------- */

.chart-ring::after {

    content: "";

    position: absolute;

    width: 78%;

    height: 78%;

    left: 11%;

    top: 11%;

    border-radius: 50%;

    background: #f8f4ec;
}


/* ---------------------------------------------------------
   TEXTOS DO GRÁFICO
   --------------------------------------------------------- */

.chart-content {

    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


.chart-percent {

    color: #00583f;

    font-size: 6.2vw;

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -0.04em;

    white-space: nowrap;
}


.chart-label {

    margin-top: 2.2%;

    color: #d85b00;

    font-size: 2.0vw;

    line-height: 1;

    font-weight: 800;

    white-space: nowrap;
}


/* =========================================================
   CELULAR
   ========================================================= */

.mobile-page {

    display: none;

    position: relative;

    width: 100vw;

    min-height: 100vh;

    overflow: hidden;

    background: #f5f0e7;
}


/* =========================================================
   GRÁFICO MOBILE
   ========================================================= */

.chart-mobile {

    position: absolute;

    /*
       posição independente do desktop
    */

    left: 50%;

    top: 43%;

    transform: translate(-50%, -50%);

    width: 43vw;

    max-width: 250px;

    aspect-ratio: 1 / 1;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;
}


.chart-mobile .chart-ring {

    position: absolute;

    inset: 0;
}


.chart-mobile .chart-percent {

    font-size: 10vw;

    max-font-size: 60px;
}


.chart-mobile .chart-label {

    font-size: 4vw;

    margin-top: 3%;
}


/* =========================================================
   TABLET / TELAS MENORES
   ========================================================= */

@media (max-width: 768px) {

    /*
       DESLIGA COMPLETAMENTE O DESKTOP
    */

    .desktop-page {
        display: none;
    }


    /*
       LIGA O LAYOUT MOBILE
    */

    .mobile-page {
        display: block;
    }

}


/* =========================================================
   DESKTOP GRANDE
   ========================================================= */

@media (min-width: 769px) {

    .desktop-page {
        display: block;
    }

    .mobile-page {
        display: none;
    }

}


/* =========================================================
   TELAS MUITO PEQUENAS
   ========================================================= */

@media (max-width: 430px) {

    .chart-mobile {

        width: 48vw;

        top: 43%;
    }

    .chart-mobile .chart-percent {

        font-size: 11vw;
    }

    .chart-mobile .chart-label {

        font-size: 4.2vw;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     DESKTOP
     ===================================================== -->

<div class="desktop-page">

    <!-- ARTE V8 / DESKTOP -->

    <img
        src="V5-BASE.png"
        class="desktop-background"
        alt="Campanha de doação de ração"
    >


    <!-- GRÁFICO DINÂMICO -->

    <div
        class="chart-desktop"
        id="chartDesktop"
        style="--progress: 42.48deg;"
    >

        <div class="chart-ring"></div>

        <div class="chart-content">

            <div
                class="chart-percent"
                id="percentDesktop"
            >
                11,8%
            </div>

            <div
                class="chart-label"
            >
                DA NOSSA META
            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     MOBILE
     ===================================================== -->

<div class="mobile-page">

    <!-- ARTE VERTICAL -->

    <img
        src="V5-CELULAR.png"
        style="
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            z-index:1;
        "
        alt="Campanha de doação de ração"
    >


    <!-- GRÁFICO MOBILE -->

    <div
        class="chart-mobile"
        id="chartMobile"
        style="--progress: 42.48deg;"
    >

        <div class="chart-ring"></div>

        <div class="chart-content">

            <div
                class="chart-percent"
                id="percentMobile"
            >
                11,8%
            </div>

            <div
                class="chart-label"
            >
                DA NOSSA META
            </div>

        </div>

    </div>

</div>



<script>

/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */

const META = 1000;


/*
   ALTERE SOMENTE ESTE VALOR QUANDO A DOAÇÃO MUDAR.

   Exemplo:

   118 = 118 KG
   250 = 250 KG
   500 = 500 KG
*/

let arrecadado = 118;


/* =========================================================
   CÁLCULO
   ========================================================= */

function atualizarGrafico() {

    let percentual = (arrecadado / META) * 100;

    /*
       Nunca ultrapassar 100%
    */

    percentual = Math.min(percentual, 100);


    /*
       Conversão para graus
    */

    const graus = percentual * 3.6;


    /*
       Formatação brasileira
    */

    const percentualTexto =
        percentual.toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }
        ) + "%";


    /* =====================================================
       DESKTOP
       ===================================================== */

    const chartDesktop =
        document.getElementById("chartDesktop");

    const percentDesktop =
        document.getElementById("percentDesktop");


    if (chartDesktop) {

        chartDesktop.style.setProperty(
            "--progress",
            graus + "deg"
        );

    }


    if (percentDesktop) {

        percentDesktop.textContent =
            percentualTexto;

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    const chartMobile =
        document.getElementById("chartMobile");

    const percentMobile =
        document.getElementById("percentMobile");


    if (chartMobile) {

        chartMobile.style.setProperty(
            "--progress",
            graus + "deg"
        );

    }


    if (percentMobile) {

        percentMobile.textContent =
            percentualTexto;

    }

}


/* =========================================================
   INICIALIZA
   ========================================================= */

atualizarGrafico();

</script>


</body>

</html>
