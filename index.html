<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Termômetro de Doação</title>


<style>

/* =========================================================
   V10 — TERMÔMETRO DE DOAÇÃO
   ========================================================= */


/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


body {

    overflow-x: hidden;
}


/* =========================================================
   DESKTOP
   ========================================================= */

.pagina {

    position: relative;

    width: min(100vw, 1600px);

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    background-image:
        url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: 100% 100%;
}


/* =========================================================
   GRÁFICO — DESKTOP
   ========================================================= */

.grafico {

    position: absolute;

    left: 66%;

    top: 53%;

    width: 30%;

    aspect-ratio: 1 / 1;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 20;
}


/* =========================================================
   CÍRCULO
   ========================================================= */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg
        );


    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);
}


/* =========================================================
   CENTRO DO CÍRCULO
   ========================================================= */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;
}


/* =========================================================
   CONTEÚDO DO GRÁFICO
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================================================
   PERCENTUAL
   ========================================================= */

.percentual {

    color: #005238;

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );

    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   DA NOSSA META
   ========================================================= */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );

    color: #d95f02;

    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );

    line-height: 1;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   DESKTOP / TABLET
   ========================================================= */

@media (max-width: 900px) and (min-width: 601px) {

    .grafico {

        left: 66%;

        top: 53%;

        width: 31%;
    }


    .percentual {

        font-size: 5vw;
    }


    .subtitulo {

        font-size: 1.7vw;
    }

}


/* =========================================================
   =========================================================
   CELULAR — LAYOUT VERTICAL
   =========================================================
   ========================================================= */

@media (max-width: 600px) {


    /* -----------------------------------------------------
       PÁGINA MOBILE
       ----------------------------------------------------- */

    .pagina {

        /*
           Agora a página é vertical.

           O desktop continua 16:9.
        */

        width: 100vw;

        height: 100vh;

        min-height: 100svh;

        aspect-ratio: auto;

        margin: 0;

        overflow: hidden;

        /*
           Não usamos mais a imagem inteira como fundo,
           porque ela é horizontal.
        */

        background-image: none;

        background-color: #f7f2e9;
    }


    /* -----------------------------------------------------
       CACHORRO / IMAGEM

       Usamos a própria V5-BASE como imagem,
       mas mostramos apenas a parte esquerda,
       onde está o cachorro.
       ----------------------------------------------------- */

    .pagina::before {

        content: "";

        position: absolute;

        top: 0;

        left: 0;

        width: 100%;

        height: 38%;

        /*
           A imagem fica maior que a tela para podermos
           mostrar a parte esquerda sem deformá-la.
        */

        background-image:
            url("V5-BASE.png");

        background-repeat: no-repeat;

        /*
           Mantém a proporção da imagem.

           A altura da imagem é usada como referência.
        */

        background-size: auto 100%;

        background-position: left center;

        z-index: 1;
    }


    /* -----------------------------------------------------
       ÁREA DE TÍTULO MOBILE
       ----------------------------------------------------- */

    .pagina::after {

        content:
            "TERMÔMETRO\A DE DOAÇÃO";

        white-space: pre;

        position: absolute;

        top: 34%;

        left: 5%;

        width: 90%;

        text-align: center;

        color: #005238;

        font-size: 8vw;

        font-weight: 900;

        line-height: 0.95;

        letter-spacing: -0.5px;

        z-index: 5;
    }


    /* -----------------------------------------------------
       GRÁFICO MOBILE
       ----------------------------------------------------- */

    .grafico {

        position: absolute;

        /*
           Agora o gráfico fica no centro
           REAL da tela.
        */

        left: 50%;

        top: 67%;


        /*
           Tamanho grande o suficiente para
           leitura no celular.
        */

        width: 42vw;

        height: 42vw;

        min-width: 180px;

        min-height: 180px;

        max-width: 280px;

        max-height: 280px;


        aspect-ratio: 1 / 1;

        transform:
            translate(-50%, -50%);

        z-index: 10;
    }


    /* -----------------------------------------------------
       PERCENTUAL MOBILE
       ----------------------------------------------------- */

    .percentual {

        font-size:
            clamp(
                40px,
                10vw,
                70px
            );

        line-height: 0.95;
    }


    /* -----------------------------------------------------
       TEXTO DA META MOBILE
       ----------------------------------------------------- */

    .subtitulo {

        margin-top: 12px;

        font-size:
            clamp(
                13px,
                3.5vw,
                22px
            );
    }


    /* -----------------------------------------------------
       META MOBILE

       Como a meta já está desenhada na imagem desktop,
       recriamos somente o texto no mobile.
       ----------------------------------------------------- */

    .meta-mobile {

        display: block;

        position: absolute;

        left: 50%;

        top: 93%;

        transform:
            translate(-50%, -50%);

        width: 95%;

        text-align: center;

        color: #005238;

        font-size:
            clamp(
                18px,
                5vw,
                28px
            );

        font-weight: 900;

        white-space: nowrap;

        z-index: 10;
    }


    .meta-mobile strong {

        color: #d95f02;

        font-size:
            clamp(
                28px,
                7vw,
                42px
            );
    }

}


/* =========================================================
   CELULARES MUITO PEQUENOS
   ========================================================= */

@media (max-width: 380px) {

    .grafico {

        width: 44vw;

        height: 44vw;

        min-width: 165px;

        min-height: 165px;

        top: 68%;
    }


    .percentual {

        font-size: 9.5vw;
    }


    .subtitulo {

        font-size: 3.3vw;
    }


    .pagina::after {

        font-size: 8.5vw;

        top: 34%;
    }

}


/* =========================================================
   META MOBILE
   =========================================================

   Fica escondida no desktop.
   ========================================================= */

.meta-mobile {

    display: none;
}


/* =========================================================
   REATIVA META NO CELULAR
   ========================================================= */

@media (max-width: 600px) {

    .meta-mobile {

        display: block;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     PÁGINA
     ======================================================= -->

<main class="pagina">


    <!-- ===================================================
         GRÁFICO DINÂMICO
         =================================================== -->

    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <div
            class="circulo"
            id="circulo"
        ></div>


        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>

    </section>


    <!-- ===================================================
         META — SOMENTE PARA CELULAR
         =================================================== -->

    <div class="meta-mobile">

        🎯 NOSSA META

        <br>

        <strong>1.000 KG</strong>

    </div>


</main>


<script>


/* =========================================================
   DADOS DA CAMPANHA
   ========================================================= */


/*
   ========================================================
   ALTERE SOMENTE ESTE NÚMERO
   ========================================================

   Atualmente:

   118 KG
   ========================================================
*/


const arrecadado = 118;


/*
   META
*/

const meta = 1000;


/* =========================================================
   CALCULA O PERCENTUAL
   ========================================================= */

let percentual =
    (arrecadado / meta) * 100;


/*
   Limita entre 0 e 100%.
*/

percentual =
    Math.max(
        0,
        Math.min(
            percentual,
            100
        )
    );


/* =========================================================
   LOCALIZA ELEMENTOS
   ========================================================= */

const percentualElemento =
    document.getElementById(
        "percentual"
    );


const circulo =
    document.getElementById(
        "circulo"
    );


/* =========================================================
   ESCREVE O PERCENTUAL
   ========================================================= */

percentualElemento.textContent =

    percentual.toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits: 1,

            maximumFractionDigits: 1
        }
    ) + "%";


/* =========================================================
   CALCULA O ÂNGULO
   ========================================================= */


/*
   100% = 360 graus

   11,8% = 42,48 graus
*/

const graus =
    percentual * 3.6;


/* =========================================================
   ATUALIZA O GRÁFICO
   ========================================================= */

circulo.style.setProperty(

    "--progresso",

    graus + "deg"

);


</script>


</body>

</html>
