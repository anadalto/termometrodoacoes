<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Termômetro de Doação</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f7f3eb;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   ÁREA PRINCIPAL
   ========================================================= */

.pagina {

    position: relative;

    width: 100%;

    /*
       A imagem da campanha foi criada em proporção 16:9.
       Mantemos a mesma proporção para NÃO ACHATAR a imagem.
    */

    aspect-ratio: 16 / 9;

    max-width: 1600px;

    margin: 0 auto;

    overflow: hidden;

    background: #f7f3eb;
}


/* =========================================================
   IMAGEM BASE
   ========================================================= */

.imagem-base {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    /*
       contain mantém a proporção original.
       NÃO usar width/height independentes com object-fit: fill.
    */

    object-fit: cover;

    object-position: center;

    z-index: 1;
}


/* =========================================================
   ÁREA DO GRÁFICO
   ========================================================= */

.area-grafico {

    position: absolute;

    /*
       69% coloca o centro do gráfico no centro
       VISUAL da área clara da imagem.
    */

    left: 69%;

    /*
       Posicionamento vertical.
    */

    top: 53%;

    transform: translate(-50%, -50%);

    /*
       IMPORTANTE:
       largura e altura são SEMPRE iguais.
       Isso impede que o círculo vire uma elipse.
    */

    width: 30%;

    aspect-ratio: 1 / 1;

    z-index: 10;

}


/* =========================================================
   GRÁFICO DONUT
   ========================================================= */

.donut {

    position: relative;

    width: 100%;

    height: 100%;

    aspect-ratio: 1 / 1;

    border-radius: 50%;

    /*
       A porcentagem será aplicada pelo JavaScript.
    */

    background:
        conic-gradient(
            #005238 0deg,
            #005238 var(--graus),
            #e5dfd3 var(--graus),
            #e5dfd3 360deg
        );

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   CENTRO DO DONUT
   ========================================================= */

.donut-centro {

    position: absolute;

    width: 78%;

    height: 78%;

    border-radius: 50%;

    background: #f7f3eb;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* =========================================================
   PERCENTUAL
   ========================================================= */

.percentual {

    color: #005238;

    /*
       O tamanho cresce junto com a página.
    */

    font-size: clamp(
        42px,
        5vw,
        90px
    );

    font-weight: 900;

    line-height: 1;

    white-space: nowrap;

    margin: 0;

}


/* =========================================================
   TEXTO "DA NOSSA META"
   ========================================================= */

.texto-meta {

    color: #d95f02;

    font-size: clamp(
        14px,
        1.45vw,
        25px
    );

    font-weight: 800;

    margin-top: 18px;

    white-space: nowrap;

}


/* =========================================================
   INFORMAÇÃO DA META
   ========================================================= */

.meta {

    position: absolute;

    /*
       Fica abaixo do gráfico.
    */

    left: 69%;

    top: 88%;

    transform: translate(-50%, -50%);

    display: flex;

    align-items: baseline;

    justify-content: center;

    white-space: nowrap;

    z-index: 12;

}


/* =========================================================
   "NOSSA META"
   ========================================================= */

.meta-label {

    color: #005238;

    font-size: clamp(
        22px,
        2.2vw,
        38px
    );

    font-weight: 900;

}


/* =========================================================
   "1.000"
   ========================================================= */

.meta-numero {

    color: #d95f02;

    font-size: clamp(
        50px,
        5vw,
        88px
    );

    font-weight: 900;

    margin-left: 10px;

    line-height: 1;

}


/* =========================================================
   "KG"
   ========================================================= */

.meta-kg {

    color: #005238;

    font-size: clamp(
        22px,
        2.2vw,
        38px
    );

    font-weight: 900;

    margin-left: 4px;

}


/* =========================================================
   RESPONSIVIDADE
   ========================================================= */

@media (max-width: 900px) {

    .area-grafico {

        width: 31%;

        left: 69%;

        top: 52%;

    }

    .meta {

        top: 88%;

        left: 69%;

    }

}


@media (max-width: 600px) {

    .pagina {

        min-width: 900px;

        transform-origin: top left;

    }

}


/* =========================================================
   GARANTIA DE PROPORÇÃO DO GRÁFICO
   ========================================================= */

.area-grafico,
.donut,
.donut-centro {

    aspect-ratio: 1 / 1;

}


</style>

</head>


<body>


<div class="pagina">


    <!-- =====================================================
         IMAGEM BASE
         ===================================================== -->

    <img
        src="V5-BASE.png"
        alt="Campanha de doação de ração"
        class="imagem-base"
    >


    <!-- =====================================================
         GRÁFICO DINÂMICO
         ===================================================== -->

    <div class="area-grafico">

        <div
            class="donut"
            id="donut"
        >

            <div class="donut-centro">

                <div
                    class="percentual"
                    id="percentual"
                >
                    0%
                </div>

                <div
                    class="texto-meta"
                >
                    DA NOSSA META
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         META DA CAMPANHA
         ===================================================== -->

    <div class="meta">

        <div class="meta-label">
            NOSSA META
        </div>

        <div class="meta-numero">
            1.000
        </div>

        <div class="meta-kg">
            KG
        </div>

    </div>


</div>


<script>

/* =========================================================
   =========================================================

   ÚNICA INFORMAÇÃO QUE VOCÊ PRECISA ALTERAR

   COLOQUE AQUI OS KG JÁ ARRECADADOS.

   Exemplo:

   118 kg  →  118

   250 kg  →  250

   500 kg  →  500

   750 kg  →  750

   1.000 kg → 1000

   =========================================================
   ========================================================= */


const kgArrecadados = 118;


/* =========================================================
   META
   ========================================================= */

const meta = 1000;


/* =========================================================
   CÁLCULO DA PORCENTAGEM
   ========================================================= */

let percentual =
    (kgArrecadados / meta) * 100;


/*
   Nunca deixar o gráfico passar de 100%.
*/

if (percentual > 100) {

    percentual = 100;

}


/* =========================================================
   CONVERSÃO PARA GRAUS
   ========================================================= */

const graus =
    (percentual / 100) * 360;


/* =========================================================
   ATUALIZA O GRÁFICO
   ========================================================= */

document
    .getElementById("donut")
    .style
    .setProperty(
        "--graus",
        graus + "deg"
    );


/* =========================================================
   ATUALIZA O TEXTO
   ========================================================= */

document
    .getElementById("percentual")
    .textContent =
        percentual
            .toFixed(1)
            .replace(".", ",") + "%";


</script>


</body>

</html>
