<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Termômetro de Doação</title>


<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f7f3eb;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   ÁREA PRINCIPAL
   ========================================================= */

.page {
    position: relative;

    width: 100%;
    min-height: 100vh;

    overflow: hidden;

    background-color: #f7f3eb;

    display: flex;
    justify-content: center;
    align-items: flex-start;
}


/* =========================================================
   IMAGEM DE FUNDO
   ========================================================= */

.background {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center center;

    z-index: 1;
}


/* =========================================================
   ÁREA DO GRÁFICO
   ========================================================= */

.chart-area {

    position: absolute;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================================================
   GRÁFICO CIRCULAR
   ========================================================= */

.progress-ring {

    position: relative;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        conic-gradient(
            #005c3b 0deg,
            #005c3b var(--progress-angle),
            #e5dfd3 var(--progress-angle),
            #e5dfd3 360deg
        );

    box-shadow:
        0 8px 25px rgba(60, 50, 40, 0.12);
}


/* =========================================================
   PARTE INTERNA DO GRÁFICO
   ========================================================= */

.progress-ring::before {

    content: "";

    position: absolute;

    width: 82%;
    height: 82%;

    border-radius: 50%;

    background: #f7f3eb;

}


/* =========================================================
   TEXTO DENTRO DO GRÁFICO
   ========================================================= */

.progress-content {

    position: relative;

    z-index: 2;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    line-height: 1;
}


/* =========================================================
   PERCENTUAL
   ========================================================= */

.percent {

    font-size: 70px;

    font-weight: 900;

    color: #005c3b;

    line-height: 1;

    letter-spacing: -2px;
}


/* =========================================================
   TEXTO DA META
   ========================================================= */

.percent-label {

    margin-top: 18px;

    font-size: 24px;

    font-weight: 800;

    color: #d95f00;

    text-transform: uppercase;

    line-height: 1.1;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 601px) {

    .page {

        aspect-ratio: 1536 / 1024;

        min-height: 100vh;
    }


    .background {

        width: 100%;
        height: 100%;

        object-fit: contain;
    }


    /*
       GRÁFICO NO DESKTOP

       Centro da área direita da arte.
    */

    .chart-area {

        width: 40vw;

        height: 40vw;

        max-width: 430px;
        max-height: 430px;

        left: 68%;

        top: 50%;

        transform:
            translate(-50%, -50%);
    }


    .progress-ring {

        width: min(28vw, 430px);

        height: min(28vw, 430px);
    }


    .percent {

        font-size: clamp(
            55px,
            5vw,
            82px
        );
    }


    .percent-label {

        font-size: clamp(
            18px,
            1.7vw,
            27px
        );
    }

}


/* =========================================================
   CELULAR
   ========================================================= */

@media (max-width: 600px) {

    .page {

        width: 100%;

        /*
           Proporção da imagem V5-CELULAR
           1536 x 2048 = 3:4
        */

        aspect-ratio: 3 / 4;

        min-height: auto;

        height: auto;

        background-image:
            url("V5-CELULAR.png");

        background-repeat: no-repeat;

        background-position: center top;

        background-size: 100% 100%;
    }


    /*
       ESCONDE A IMAGEM DESKTOP
    */

    .background {

        display: none;
    }


    /*
       ÁREA DO GRÁFICO

       O gráfico fica exatamente na região
       vazia entre o título e a meta.
    */

    .chart-area {

        width: 100%;

        height: auto;

        left: 50%;

        /*
           POSIÇÃO VERTICAL DO GRÁFICO

           43% coloca o centro do gráfico
           aproximadamente no meio da área vazia.
        */

        top: 45%;

        transform:
            translate(-50%, -50%);
    }


    /*
       TAMANHO DO GRÁFICO

       O tamanho acompanha a largura
       da tela do celular.
    */

    .progress-ring {

        width: 52vw;

        height: 52vw;

        max-width: 300px;

        max-height: 300px;
    }


    /*
       PERCENTUAL PROPORCIONAL
       AO TAMANHO DO GRÁFICO
    */

    .percent {

        font-size: 12vw;

        max-font-size: 72px;

        font-weight: 900;

        letter-spacing: -1px;
    }


    /*
       TEXTO ABAIXO DO PERCENTUAL
    */

    .percent-label {

        margin-top: 12px;

        font-size: 4.2vw;

        font-weight: 800;
    }

}


/* =========================================================
   CELULARES MUITO PEQUENOS
   ========================================================= */

@media (max-width: 380px) {

    .chart-area {

        top: 45%;
    }


    .progress-ring {

        width: 54vw;

        height: 54vw;
    }


    .percent {

        font-size: 13vw;
    }


    .percent-label {

        font-size: 4.5vw;
    }

}


/* =========================================================
   CELULARES GRANDES
   ========================================================= */

@media (min-width: 601px) and (max-width: 1000px) {

    .chart-area {

        left: 68%;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         IMAGEM DESKTOP
         ===================================================== -->

    <img
        class="background"
        src="V5-BASE.png"
        alt="Campanha de doação de ração"
    >


    <!-- =====================================================
         GRÁFICO DINÂMICO
         ===================================================== -->

    <div
        class="chart-area"
        id="chartArea"
    >

        <div
            class="progress-ring"
            id="progressRing"
        >

            <div class="progress-content">

                <div
                    class="percent"
                    id="percent"
                >
                    11,8%
                </div>

                <div
                    class="percent-label"
                >
                    DA NOSSA META
                </div>

            </div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   DADOS DA CAMPANHA
   ========================================================= */


/*
   ALTERE SOMENTE ESTE NÚMERO
   QUANDO RECEBER NOVAS DOAÇÕES.
*/

const arrecadado = 118;


/*
   META TOTAL DA CAMPANHA
*/

const meta = 1000;


/* =========================================================
   CÁLCULO DO PERCENTUAL
   ========================================================= */

let percentual = (arrecadado / meta) * 100;


/*
   Impede passar de 100%
*/

if (percentual > 100) {

    percentual = 100;

}


/* =========================================================
   ÂNGULO DO GRÁFICO
   ========================================================= */

const angulo = percentual * 3.6;


/* =========================================================
   ATUALIZA O GRÁFICO
   ========================================================= */

const progressRing =
    document.getElementById("progressRing");


progressRing.style.setProperty(
    "--progress-angle",
    angulo + "deg"
);


/* =========================================================
   ATUALIZA O TEXTO
   ========================================================= */

const percentElement =
    document.getElementById("percent");


percentElement.textContent =
    percentual
        .toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }
        )
        + "%";


/* =========================================================
   ANIMAÇÃO INICIAL
   ========================================================= */

progressRing.animate(

    [
        {
            "--progress-angle": "0deg"
        },

        {
            "--progress-angle":
                angulo + "deg"
        }
    ],

    {
        duration: 1200,

        easing: "ease-out",

        fill: "forwards"
    }

);

</script>


</body>

</html>
