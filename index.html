<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Termômetro de Doação</title>


<style>


/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;

}


body {

    overflow-x: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}



/* =========================================================
   =========================================================
   DESKTOP — V8 ORIGINAL
   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   PÁGINA
   --------------------------------------------------------- */

.pagina {
    position: relative;

    /*
       DESKTOP — AJUSTE V8 CORRIGIDO

       A arte continua 16:9,
       mas agora nunca ultrapassa
       a altura disponível da janela.

       Isso faz a imagem inteira
       aparecer na tela sem cortar
       a parte de baixo.
    */

    width: min(
        100vw,
        1600px,
        calc(100vh * 16 / 9)
    );

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    background-image: url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: 100% 100%;
}


/* =========================================================
   GRÁFICO DINÂMICO — V8
   ========================================================= */

.grafico {

    position: absolute;


    /*
       POSIÇÃO HORIZONTAL — V8

       66% coloca o centro do gráfico
       na região clara da arte.
    */

    left: 66%;


    /*
       POSIÇÃO VERTICAL — V8
    */

    top: 53%;


    /*
       TAMANHO — V8
    */

    width: 30%;

    aspect-ratio: 1 / 1;


    /*
       Centraliza o próprio gráfico
       no ponto definido acima.
    */

    transform:
        translate(-50%, -50%);


    display: flex;

    align-items: center;

    justify-content: center;


    z-index: 20;

}



/* ---------------------------------------------------------
   CÍRCULO DO GRÁFICO
   --------------------------------------------------------- */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;


    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg

        );


    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);

}



/* ---------------------------------------------------------
   PARTE INTERNA DO CÍRCULO
   --------------------------------------------------------- */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;

}



/* =========================================================
   TEXTO DO GRÁFICO — V8
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}



/* ---------------------------------------------------------
   PERCENTUAL — V8
   --------------------------------------------------------- */

.percentual {

    color: #005238;


    /*
       Tamanho original da V8.
    */

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );


    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   TEXTO "DA NOSSA META" — V8
   --------------------------------------------------------- */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );


    color: #d95f02;


    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );


    line-height: 1;

    font-weight: 900;

    white-space: nowrap;

}



/* =========================================================
   =========================================================
   MOBILE — V13 ORIGINAL
   =========================================================
   ========================================================= */


/*
   IMPORTANTE:

   A partir daqui é a estrutura mobile
   que você disse que está funcionando.

   Não estamos usando a .pagina do desktop
   para o mobile.

   O mobile é uma página independente.
*/



.mobile-page {

    display: none;

    position: relative;

    width: 100vw;

    min-height: 100vh;

    overflow: hidden;

    background: #f5f0e7;

}



/* =========================================================
   GRÁFICO MOBILE — V13
   ========================================================= */

.chart-mobile {

    position: absolute;


    /*
       posição independente do desktop
    */

    left: 50%;

    top: 43%;


    transform:
        translate(-50%, -50%);


    width: 43vw;

    max-width: 250px;

    aspect-ratio: 1 / 1;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}



/* ---------------------------------------------------------
   CÍRCULO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;


    background:
        conic-gradient(

            #00583f 0deg,

            #00583f var(--progress),

            #e4ddd1 var(--progress),

            #e4ddd1 360deg

        );


    box-shadow:
        0 12px 25px
        rgba(60, 45, 30, 0.10);

}



/* ---------------------------------------------------------
   FURO DO CÍRCULO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-ring::after {

    content: "";

    position: absolute;

    width: 78%;

    height: 78%;

    left: 11%;

    top: 11%;

    border-radius: 50%;

    background: #f8f4ec;

}



/* ---------------------------------------------------------
   CONTEÚDO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-content {

    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}



/* ---------------------------------------------------------
   PERCENTUAL MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-percent {

    color: #00583f;

    font-size: 10vw;

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -0.04em;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   TEXTO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-label {

    margin-top: 3%;

    color: #d85b00;

    font-size: 4vw;

    line-height: 1;

    font-weight: 800;

    white-space: nowrap;

}



/* =========================================================
   TABLET / TELAS MENORES — V13
   ========================================================= */

@media (max-width: 768px) {


    /*
       DESLIGA COMPLETAMENTE O DESKTOP
    */

    .pagina {

        display: none;

    }


    /*
       LIGA O LAYOUT MOBILE
    */

    .mobile-page {

        display: block;

    }

}



/* =========================================================
   DESKTOP GRANDE — V13
   ========================================================= */

@media (min-width: 769px) {


    /*
       DESKTOP V8
       permanece ativo
    */

    .pagina {

        display: block;

    }


    /*
       MOBILE DESLIGADO
    */

    .mobile-page {

        display: none;

    }

}



/* =========================================================
   TELAS MUITO PEQUENAS — V13
   ========================================================= */

@media (max-width: 430px) {


    .chart-mobile {

        width: 48vw;

        top: 43%;

    }


    .chart-mobile .chart-percent {

        font-size: 11vw;

    }


    .chart-mobile .chart-label {

        font-size: 4.2vw;

    }

}



</style>

</head>


<body>



<!-- =======================================================
     DESKTOP
     ======================================================= -->


<main class="pagina">


    <!-- ===================================================
         GRÁFICO DINÂMICO — V8
         =================================================== -->


    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <!-- CÍRCULO -->

        <div
            class="circulo"
            id="circulo"
        ></div>



        <!-- TEXTOS -->

        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>


    </section>


</main>



<!-- =======================================================
     MOBILE
     ======================================================= -->


<div class="mobile-page">


    <!-- ===================================================
         ARTE VERTICAL
         =================================================== -->


    <img
        src="V5-CELULAR.png"

        style="
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            z-index:1;
        "

        alt="Campanha de doação de ração"
    >



    <!-- ===================================================
         GRÁFICO MOBILE
         =================================================== -->


    <div
        class="chart-mobile"
        id="chartMobile"
        style="--progress: 42.48deg;"
    >


        <div class="chart-ring"></div>


        <div class="chart-content">


            <div
                class="chart-percent"
                id="percentMobile"
            >
                11,8%
            </div>


            <div
                class="chart-label"
            >
                DA NOSSA META
            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */


/*
   ALTERE SOMENTE ESTE VALOR.

   Atualmente:

   118 KG

   Meta:

   1.000 KG
*/


const META = 1000;


let arrecadado = 118;



/* =========================================================
   CÁLCULO
   ========================================================= */


function atualizarGrafico() {


    let percentual =
        (arrecadado / META) * 100;


    /*
       Nunca ultrapassar 100%
    */

    percentual =
        Math.min(
            percentual,
            100
        );


    /*
       Conversão para graus
    */

    const graus =
        percentual * 3.6;


    /*
       Formatação brasileira
    */

    const percentualTexto =

        percentual.toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }
        ) + "%";



    /* =====================================================
       DESKTOP — V8
       ===================================================== */


    const circulo =
        document.getElementById(
            "circulo"
        );


    const percentualElemento =
        document.getElementById(
            "percentual"
        );


    if (circulo) {

        circulo.style.setProperty(

            "--progresso",

            graus + "deg"

        );

    }


    if (percentualElemento) {

        percentualElemento.textContent =
            percentualTexto;

    }



    /* =====================================================
       MOBILE — V13
       ===================================================== */


    const chartMobile =
        document.getElementById(
            "chartMobile"
        );


    const percentMobile =
        document.getElementById(
            "percentMobile"
        );


    if (chartMobile) {

        chartMobile.style.setProperty(

            "--progress",

            graus + "deg"

        );

    }


    if (percentMobile) {

        percentMobile.textContent =
            percentualTexto;

    }

}



/* =========================================================
   INICIALIZA
   ========================================================= */


atualizarGrafico();


</script>


</body>

</html>
