<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Termômetro de Doação</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f7f3eb;
}


/* =========================================================
   ÁREA PRINCIPAL
   ========================================================= */

.pagina {

    position: relative;

    width: 100vw;

    max-width: 1600px;

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    background-image: url("/termometrodoacoes/V5-BASE.png");

    background-size: 100% 100%;

    background-position: center;

    background-repeat: no-repeat;
}


/* =========================================================
   GRÁFICO DINÂMICO
   ========================================================= */

grafico {

    position: absolute;

    /* CENTRO DA ÁREA CLARA DA IMAGEM */
    left: 69%;

    top: 52%;

    transform: translate(-50%, -50%);

    /* tamanho do gráfico */
    width: 30%;

    aspect-ratio: 1 / 1;
}


/* =========================================================
   CÍRCULO DO GRÁFICO
   ========================================================= */

.circulo {

    position: relative;

    width: 100%;

    height: 100%;

    border-radius: 50%;

    background:
        conic-gradient(
            #005238 0deg,
            #005238 var(--angulo),
            #e5ded2 var(--angulo),
            #e5ded2 360deg
        );

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   BURACO INTERNO DO CÍRCULO
   ========================================================= */

.circulo::before {

    content: "";

    position: absolute;

    width: 78%;

    height: 78%;

    border-radius: 50%;

    background: #f7f3eb;

}


/* =========================================================
   CONTEÚDO DENTRO DO GRÁFICO
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   PORCENTAGEM
   ========================================================= */

.percentual {

    color: #005238;

    font-size: clamp(
        55px,
        5vw,
        90px
    );

    font-weight: 900;

    line-height: 1;

    white-space: nowrap;

}


/* =========================================================
   TEXTO ABAIXO DA PORCENTAGEM
   ========================================================= */

.legenda {

    margin-top: 22px;

    color: #d85b00;

    font-size: clamp(
        18px,
        1.5vw,
        28px
    );

    font-weight: 900;

    line-height: 1;

    white-space: nowrap;

}


/* =========================================================
   RESPONSIVIDADE
   ========================================================= */

@media (max-width: 900px) {

    .grafico {

        left: 72%;

        top: 51%;

        width: 30%;

    }

    .percentual {

        font-size: clamp(
            32px,
            5vw,
            60px
        );

    }

    .legenda {

        margin-top: 12px;

        font-size: clamp(
            11px,
            1.5vw,
            20px
        );

    }

}

</style>

</head>


<body>


<!-- =====================================================
     PÁGINA
     ===================================================== -->

<div class="pagina">


    <!-- =================================================
         GRÁFICO DINÂMICO
         ================================================= -->

    <div
        class="grafico"
        id="grafico"
    >

        <div
            class="circulo"
            id="circulo"
        >

            <div class="conteudo-grafico">

                <div
                    class="percentual"
                    id="percentual"
                >
                    11,8%
                </div>

                <div
                    class="legenda"
                >
                    DA NOSSA META
                </div>

            </div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */


/*
   ATUALIZE SOMENTE ESTE NÚMERO

   Quantidade de KG arrecadados atualmente.
*/

const kgArrecadados = 118;


/*
   META DA CAMPANHA
*/

const meta = 1000;


/* =========================================================
   CÁLCULO
   ========================================================= */

let percentual =
    (kgArrecadados / meta) * 100;


/*
   Limita a 100%
*/

if (percentual > 100) {

    percentual = 100;

}


/* =========================================================
   TRANSFORMA PORCENTAGEM EM ÂNGULO
   ========================================================= */

const angulo =
    percentual * 3.6;


/* =========================================================
   ATUALIZA O GRÁFICO
   ========================================================= */

document
    .getElementById("circulo")
    .style.setProperty(
        "--angulo",
        angulo + "deg"
    );


/* =========================================================
   ATUALIZA A PORCENTAGEM
   ========================================================= */

document
    .getElementById("percentual")
    .textContent =
        percentual
            .toFixed(1)
            .replace(".", ",") + "%";


</script>


</body>

</html>
