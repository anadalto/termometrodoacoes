<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Termômetro de Doação</title>


<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;

    background: #f7f3eb;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    overflow-x: hidden;

}


/* =========================================================
   PÁGINA
   ========================================================= */

.page {

    position: relative;

    width: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #f7f3eb;

}


/* =========================================================
   IMAGEM DESKTOP
   ========================================================= */

.background {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

}


/* =========================================================
   GRÁFICO
   ========================================================= */

.chart-area {

    position: absolute;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

}


/* =========================================================
   CÍRCULO
   ========================================================= */

.progress-ring {

    position: relative;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:

        conic-gradient(

            #005238 0deg,

            #005238 var(--progress-angle),

            #e5dfd4 var(--progress-angle),

            #e5dfd4 360deg

        );

    filter:
        drop-shadow(
            0 8px 15px
            rgba(0,0,0,0.08)
        );

}


/* =========================================================
   CENTRO DO GRÁFICO
   ========================================================= */

.progress-ring::before {

    content: "";

    position: absolute;

    width: 76%;
    height: 76%;

    border-radius: 50%;

    background: #f7f3eb;

    z-index: 1;

}


/* =========================================================
   CONTEÚDO DO GRÁFICO
   ========================================================= */

.progress-content {

    position: absolute;

    z-index: 2;

    width: 70%;
    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 601px) {


    /* -----------------------------------------------------
       PROPORÇÃO DA ARTE DESKTOP

       V5-BASE.png
       1536 x 1024
       ----------------------------------------------------- */

    .page {

        width: 100%;

        aspect-ratio: 1536 / 1024;

        height: auto;

    }


    /* -----------------------------------------------------
       IMAGEM DESKTOP
       ----------------------------------------------------- */

    .background {

        display: block;

        width: 100%;
        height: 100%;

        object-fit: fill;

        object-position: center;

    }


    /* -----------------------------------------------------
       GRÁFICO DESKTOP

       ESTA É A POSIÇÃO DA V8.

       NÃO É PARA FICAR NO CENTRO MATEMÁTICO DA TELA.

       Ele fica centralizado na área clara da arte,
       à direita da foto.

       ----------------------------------------------------- */

    .chart-area {

        left: 72%;

        top: 52%;

        width: 29vw;

        height: 29vw;

        transform:
            translate(-50%, -50%);

    }


    /* -----------------------------------------------------
       PERCENTUAL DESKTOP

       IMPORTANTE:

       NÃO USAMOS MAIS:

       font-size: 15%;

       porque isso NÃO significa 15% do gráfico.

       Agora usamos vw + clamp.

       ----------------------------------------------------- */

    .percent {

        color: #005238;

        font-size:
            clamp(
                60px,
                6vw,
                105px
            );

        font-weight: 900;

        line-height: 1;

        white-space: nowrap;

        letter-spacing: -3px;

    }


    /* -----------------------------------------------------
       "DA NOSSA META"
       ----------------------------------------------------- */

    .percent-label {

        margin-top: 18px;

        color: #d85b00;

        font-size:
            clamp(
                20px,
                1.65vw,
                34px
            );

        font-weight: 900;

        line-height: 1.1;

        white-space: nowrap;

        text-transform: uppercase;

    }


}


/* =========================================================
   CELULAR
   ========================================================= */

@media (max-width: 600px) {


    /* -----------------------------------------------------
       ARTE VERTICAL

       V5-CELULAR.png
       1536 x 2048
       ----------------------------------------------------- */

    .page {

        width: 100%;

        aspect-ratio: 1536 / 2048;

        height: auto;

        background:

            url("V5-CELULAR.png")

            center top /

            100% 100%

            no-repeat;

    }


    /* -----------------------------------------------------
       ESCONDE A IMAGEM DESKTOP
       ----------------------------------------------------- */

    .background {

        display: none;

    }


    /* -----------------------------------------------------
       GRÁFICO MOBILE
       ----------------------------------------------------- */

    .chart-area {

        left: 50%;

        top: 68%;

        width: 42vw;

        height: 42vw;

        min-width: 150px;

        min-height: 150px;

        max-width: 250px;

        max-height: 250px;

        transform:
            translate(-50%, -50%);

    }


    /* -----------------------------------------------------
       CÍRCULO MOBILE
       ----------------------------------------------------- */

    .progress-ring {

        width: 100%;
        height: 100%;

    }


    /* -----------------------------------------------------
       CENTRO MOBILE
       ----------------------------------------------------- */

    .progress-ring::before {

        width: 82%;
        height: 82%;

    }


    /* -----------------------------------------------------
       PERCENTUAL MOBILE
       ----------------------------------------------------- */

    .percent {

        font-size: 9vw;

        font-weight: 900;

        color: #005238;

        line-height: 1;

        white-space: nowrap;

        letter-spacing: -1px;

    }


    /* -----------------------------------------------------
       LEGENDA MOBILE
       ----------------------------------------------------- */

    .percent-label {

        margin-top: 4%;

        font-size: 3.2vw;

        font-weight: 800;

        color: #d85b00;

        line-height: 1.1;

        white-space: nowrap;

        text-transform: uppercase;

    }

}


/* =========================================================
   CELULARES PEQUENOS
   ========================================================= */

@media (max-width: 380px) {


    .chart-area {

        top: 69%;

    }


    .percent {

        font-size: 9vw;

    }


    .percent-label {

        font-size: 3.3vw;

    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         IMAGEM DESKTOP
         ===================================================== -->

    <img
        class="background"
        src="V5-BASE.png"
        alt="Campanha de doação de ração"
    >


    <!-- =====================================================
         GRÁFICO DINÂMICO
         ===================================================== -->

    <div
        class="chart-area"
        id="chartArea"
    >

        <div
            class="progress-ring"
            id="progressRing"
        >

            <div
                class="progress-content"
            >

                <div
                    class="percent"
                    id="percent"
                >
                    11,8%
                </div>


                <div
                    class="percent-label"
                >
                    DA NOSSA META
                </div>

            </div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   DADOS DA CAMPANHA
   ========================================================= */


/*
   ALTERE SOMENTE ESTE NÚMERO.

   Atualmente temos:

   118 KG
*/

const arrecadado = 118;


/* =========================================================
   META
   ========================================================= */

const meta = 1000;


/* =========================================================
   CALCULA PERCENTUAL
   ========================================================= */

let percentual =
    (arrecadado / meta) * 100;


/* =========================================================
   LIMITES
   ========================================================= */

if (percentual > 100) {

    percentual = 100;

}

if (percentual < 0) {

    percentual = 0;

}


/* =========================================================
   ELEMENTOS
   ========================================================= */

const progressRing =
    document.getElementById(
        "progressRing"
    );


const percentElement =
    document.getElementById(
        "percent"
    );


/* =========================================================
   ANIMAÇÃO
   ========================================================= */

const duracao = 1800;

const inicio =
    performance.now();


function animarGrafico(tempoAtual) {


    const tempoDecorrido =
        tempoAtual - inicio;


    let progresso =
        tempoDecorrido / duracao;


    if (progresso > 1) {

        progresso = 1;

    }


    /* ---------------------------------------------
       Easing suave
       --------------------------------------------- */

    const suavizado =
        1 -
        Math.pow(
            1 - progresso,
            3
        );


    /* ---------------------------------------------
       Valor atual
       --------------------------------------------- */

    const valorAtual =
        percentual * suavizado;


    /* ---------------------------------------------
       Converte para graus
       --------------------------------------------- */

    const angulo =
        valorAtual * 3.6;


    /* ---------------------------------------------
       Atualiza gráfico
       --------------------------------------------- */

    progressRing.style.setProperty(

        "--progress-angle",

        angulo + "deg"

    );


    /* ---------------------------------------------
       Atualiza número
       --------------------------------------------- */

    percentElement.textContent =

        valorAtual
            .toFixed(1)
            .replace(".", ",")
        + "%";


    /* ---------------------------------------------
       Continua animação
       --------------------------------------------- */

    if (progresso < 1) {

        requestAnimationFrame(
            animarGrafico
        );

    }

    else {

        percentElement.textContent =

            percentual
                .toFixed(1)
                .replace(".", ",")
            + "%";

    }

}


/* =========================================================
   INICIA GRÁFICO
   ========================================================= */

requestAnimationFrame(
    animarGrafico
);

</script>


</body>

</html>
