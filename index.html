<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Rumo aos 1.000 KG</title>


<style>


/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;

}


body {

    overflow-x: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}



/* =========================================================
   =========================================================
   DESKTOP
   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   PÁGINA DESKTOP
   --------------------------------------------------------- */

.pagina {

    position: relative;

    width: min(
        100vw,
        1600px,
        calc(100vh * 16 / 9)
    );

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    background-image: url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: 100% 100%;
}



/* =========================================================
   GRÁFICO DINÂMICO — DESKTOP
   ========================================================= */

.grafico {

    position: absolute;

    left: 66%;

    top: 55%;

    width: 28%;

    aspect-ratio: 1 / 1;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 20;
}



/* ---------------------------------------------------------
   CÍRCULO DESKTOP
   --------------------------------------------------------- */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg

        );

    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);

}



/* ---------------------------------------------------------
   PARTE INTERNA
   --------------------------------------------------------- */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;

}



/* =========================================================
   TEXTO DO GRÁFICO — DESKTOP
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}



/* ---------------------------------------------------------
   PERCENTUAL DESKTOP
   --------------------------------------------------------- */

.percentual {

    color: #005238;

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );

    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   SUBTÍTULO DESKTOP
   --------------------------------------------------------- */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );

    color: #d95f02;

    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );

    line-height: 1;

    font-weight: 900;

    white-space: nowrap;

}



/* =========================================================
   =========================================================
   MOBILE
   =========================================================
   ========================================================= */


/*
   O DESKTOP NÃO PARTICIPA DO LAYOUT MOBILE.

   No celular usamos uma página vertical
   independente.
*/


.mobile-page {

    display: none;

    position: relative;

    width: 100vw;

    aspect-ratio: 9 / 16;

    height: auto;

    min-height: 0;

    overflow: hidden;

    background: #f5f0e7;

}



/* =========================================================
   ARTE VERTICAL MOBILE
   ========================================================= */

.mobile-page > img {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: fill;

    display: block;

    z-index: 1;

}



/* =========================================================
   GRÁFICO MOBILE
   ========================================================= */

.chart-mobile {

    position: absolute;

    left: 50%;

    top: 57%;

    transform:
        translate(-50%, -50%);

    width: 43vw;

    max-width: 250px;

    aspect-ratio: 1 / 1;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}



/* =========================================================
   CÍRCULO MOBILE
   ========================================================= */

.chart-mobile .chart-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #00583f 0deg,

            #00583f var(--progress),

            #e4ddd1 var(--progress),

            #e4ddd1 360deg

        );

    box-shadow:
        0 12px 25px
        rgba(60, 45, 30, 0.10);

}



/* ---------------------------------------------------------
   FURO DO CÍRCULO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-ring::after {

    content: "";

    position: absolute;

    width: 78%;

    height: 78%;

    left: 11%;

    top: 11%;

    border-radius: 50%;

    background: #f8f4ec;

}



/* ---------------------------------------------------------
   CONTEÚDO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-content {

    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}



/* ---------------------------------------------------------
   PERCENTUAL MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-percent {

    color: #00583f;

    font-size: 10vw;

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -0.04em;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   TEXTO MOBILE
   --------------------------------------------------------- */

.chart-mobile .chart-label {

    margin-top: 3%;

    color: #d85b00;

    font-size: 4vw;

    line-height: 1;

    font-weight: 800;

    white-space: nowrap;

}



/* =========================================================
   ATIVAÇÃO MOBILE
   ========================================================= */

@media (max-width: 768px) {

    .pagina {

        display: none;

    }


    .mobile-page {

        display: block;

    }

}



/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 769px) {

    .pagina {

        display: block;

    }


    .mobile-page {

        display: none;

    }

}



/* =========================================================
   CELULARES PEQUENOS
   ========================================================= */

@media (max-width: 430px) {

    .chart-mobile {

        width: 43vw;

        top: 57%;

    }


    .chart-mobile .chart-percent {

        font-size: 10vw;

    }


    .chart-mobile .chart-label {

        font-size: 4vw;

    }

}



</style>

</head>



<body>



<!-- =======================================================
     DESKTOP
     ======================================================= -->

<main class="pagina">


    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <div
            class="circulo"
            id="circulo"
        ></div>


        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>


    </section>


</main>



<!-- =======================================================
     MOBILE
     ======================================================= -->

<div class="mobile-page">


    <img
        src="V5-CELULAR.png"
        alt="Campanha de doação de ração"
    >



    <div
        class="chart-mobile"
        id="chartMobile"
    >


        <div class="chart-ring"></div>


        <div class="chart-content">


            <div
                class="chart-percent"
                id="percentMobile"
            >
                11,8%
            </div>


            <div
                class="chart-label"
            >
                DA NOSSA META
            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */


/*
   ========================================================
   ALTERE SOMENTE ESTE NÚMERO
   ========================================================

   Exemplo:

   118 = 11,8%
   250 = 25,0%
   500 = 50,0%
   750 = 75,0%

   Meta:
   1.000 KG
*/


const META = 1000;


/* =========================================================
   VALOR ATUAL DA ARRECADAÇÃO
   ========================================================= */


let arrecadado = 341,70;



/* =========================================================
   CONFIGURAÇÃO DA ANIMAÇÃO
   ========================================================= */


const DURACAO_ANIMACAO = 1800;


/* =========================================================
   ATUALIZA OS GRÁFICOS
   ========================================================= */


function atualizarGrafico(
    percentualFinal,
    animar = true
) {


    const circulo =
        document.getElementById(
            "circulo"
        );


    const percentualElemento =
        document.getElementById(
            "percentual"
        );


    const chartMobile =
        document.getElementById(
            "chartMobile"
        );


    const percentMobile =
        document.getElementById(
            "percentMobile"
        );


    /*
       Se não houver elementos,
       não faz nada.
    */

    if (
        !circulo &&
        !chartMobile
    ) {

        return;

    }



    /* =====================================================
       ANIMAÇÃO
       ===================================================== */


    if (animar) {

        const inicio = performance.now();


        function animarGrafico(tempoAtual) {


            const decorrido =
                tempoAtual - inicio;


            let progressoAnimacao =
                decorrido / DURACAO_ANIMACAO;


            /*
               Limita entre 0 e 1.
            */

            progressoAnimacao =
                Math.max(
                    0,
                    Math.min(
                        progressoAnimacao,
                        1
                    )
                );


            /*
               Easing suave.

               Começa devagar,
               acelera no meio
               e termina suavemente.
            */

            const suavizado =
                1 -
                Math.pow(
                    1 - progressoAnimacao,
                    3
                );


            const percentualAtual =
                percentualFinal *
                suavizado;


            const grausAtual =
                percentualAtual *
                3.6;


            const textoAtual =

                percentualAtual.toLocaleString(
                    "pt-BR",
                    {
                        minimumFractionDigits: 1,
                        maximumFractionDigits: 1
                    }
                ) + "%";


            /*
               DESKTOP
            */

            if (circulo) {

                circulo.style.setProperty(

                    "--progresso",

                    grausAtual + "deg"

                );

            }


            if (percentualElemento) {

                percentualElemento.textContent =
                    textoAtual;

            }


            /*
               MOBILE
            */

            if (chartMobile) {

                chartMobile.style.setProperty(

                    "--progress",

                    grausAtual + "deg"

                );

            }


            if (percentMobile) {

                percentMobile.textContent =
                    textoAtual;

            }


            /*
               Continua a animação
               até chegar ao final.
            */

            if (
                progressoAnimacao < 1
            ) {

                requestAnimationFrame(
                    animarGrafico
                );

            }

        }


        requestAnimationFrame(
            animarGrafico
        );


    } else {


        /*
           Atualização instantânea,
           caso seja necessária.
        */

        const graus =
            percentualFinal * 3.6;


        const texto =

            percentualFinal.toLocaleString(
                "pt-BR",
                {
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1
                }
            ) + "%";


        if (circulo) {

            circulo.style.setProperty(

                "--progresso",

                graus + "deg"

            );

        }


        if (percentualElemento) {

            percentualElemento.textContent =
                texto;

        }


        if (chartMobile) {

            chartMobile.style.setProperty(

                "--progress",

                graus + "deg"

            );

        }


        if (percentMobile) {

            percentMobile.textContent =
                texto;

        }

    }

}



/* =========================================================
   CALCULA O PERCENTUAL
   ========================================================= */


function iniciarGrafico() {


    let percentual =

        (arrecadado / META) *
        100;


    /*
       Nunca ultrapassar 100%.
    */

    percentual =

        Math.max(
            0,
            Math.min(
                percentual,
                100
            )
        );


    atualizarGrafico(
        percentual,
        true
    );

}



/* =========================================================
   INICIA O GRÁFICO
   ========================================================= */


iniciarGrafico();



/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA DA PÁGINA
   ========================================================= */


/*
   A página será atualizada automaticamente
   a cada 5 minutos.

   Isso significa que:

   - você altera o valor no GitHub;
   - salva;
   - o computador que está exibindo
     o termômetro não precisa receber
     nenhum clique;
   - no próximo ciclo de atualização,
     ele recarrega a página;
   - o novo valor aparece automaticamente.

   5 minutos = 300.000 milissegundos.
*/


const INTERVALO_ATUALIZACAO =
    5 * 60 * 1000;


setTimeout(
    function atualizarPagina() {


        /*
           Adiciona um parâmetro de tempo
           para evitar que o navegador
           use uma versão antiga em cache.
        */

        const novaUrl =

            window.location.pathname +
            "?atualizacao=" +
            Date.now();


        window.location.href =
            novaUrl;


    },

    INTERVALO_ATUALIZACAO

);


</script>


</body>

</html>
