<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Termômetro de Doação</title>


<style>


/* =========================================================
   CONFIGURAÇÕES GERAIS
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #f7f2e9;

}


body {

    overflow-x: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}



/* =========================================================
   =========================================================
   DESKTOP
   =========================================================
   ========================================================= */


/* ---------------------------------------------------------
   PÁGINA DESKTOP
   --------------------------------------------------------- */

.pagina {

    position: relative;

    width: min(
        100vw,
        1600px,
        calc(100vh * 16 / 9)
    );

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    overflow: hidden;

    background-image: url("V5-BASE.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: cover;
}



/* =========================================================
   GRÁFICO DINÂMICO — DESKTOP
   ========================================================= */

.grafico {

    position: absolute;

    left: 66%;

    top: 55%;

    width: 28%;

    aspect-ratio: 1 / 1;

    transform:
        translate(-50%, -50%);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 20;
}



/* ---------------------------------------------------------
   CÍRCULO DESKTOP
   --------------------------------------------------------- */

.circulo {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #005238 0deg,

            #005238 var(--progresso),

            #e5dfd3 var(--progresso),

            #e5dfd3 360deg

        );

    box-shadow:
        0 8px 24px
        rgba(50, 40, 25, 0.10);

}



/* ---------------------------------------------------------
   PARTE INTERNA
   --------------------------------------------------------- */

.circulo::after {

    content: "";

    position: absolute;

    inset: 11%;

    border-radius: 50%;

    background: #f7f2e9;

}



/* =========================================================
   TEXTO DO GRÁFICO — DESKTOP
   ========================================================= */

.conteudo-grafico {

    position: relative;

    z-index: 2;

    width: 70%;

    height: 70%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}



/* ---------------------------------------------------------
   PERCENTUAL DESKTOP
   --------------------------------------------------------- */

.percentual {

    color: #005238;

    font-size:
        clamp(
            42px,
            5.2vw,
            88px
        );

    line-height: 0.95;

    font-weight: 900;

    white-space: nowrap;

}



/* ---------------------------------------------------------
   SUBTÍTULO DESKTOP
   --------------------------------------------------------- */

.subtitulo {

    margin-top:
        clamp(
            12px,
            1.2vw,
            22px
        );

    color: #d95f02;

    font-size:
        clamp(
            16px,
            1.55vw,
            30px
        );

    line-height: 1;

    font-weight: 900;

    white-space: nowrap;

}



/* =========================================================
   =========================================================
   MOBILE
   =========================================================
   ========================================================= */


/*
   O DESKTOP NÃO PARTICIPA DO LAYOUT MOBILE.

   No celular usamos uma página vertical
   independente.
*/


.mobile-page {

    display: none;

    position: relative;

    width: 100vw;

    /*
       IMPORTANTE:
       A arte vertical será tratada como 9:16.
    */

    aspect-ratio: 9 / 16;

    height: auto;

    min-height: 0;

    overflow: hidden;

    background: #f5f0e7;

}



/* =========================================================
   ARTE VERTICAL MOBILE
   ========================================================= */

.mobile-page > img {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    /*
       Não usamos "cover".

       A arte precisa ocupar exatamente
       o quadro vertical inteiro.
    */

    object-fit: fill;

    display: block;

    z-index: 1;

}



/* =========================================================
   GRÁFICO MOBILE — V14
   ========================================================= */

.chart-mobile {

    position: absolute;

    /*
       CENTRO HORIZONTAL
    */

    left: 50%;


    /*
       POSIÇÃO VERTICAL

       O gráfico fica abaixo do título,
       no espaço livre central da arte.
    */

    top: 57%;


    transform:
        translate(-50%, -50%);


    /*
       TAMANHO DO GRÁFICO

       Mantemos proporcional à largura
       do celular.
    */

    width: 43vw;

    max-width: 250px;

    aspect-ratio: 1 / 1;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}



/* =========================================================
   CÍRCULO MOBILE
   ========================================================= */

.chart-mobile .chart-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        conic-gradient(

            #00583f 0deg,

            #00583f var(--progress),

            #e4ddd1 var(--progress),

            #e4ddd1 360deg

        );

    box-shadow:
        0 12px 25px
        rgba(60, 45, 30, 0.10);

}



/* =========================================================
   FURO DO CÍRCULO MOBILE
   ========================================================= */

.chart-mobile .chart-ring::after {

    content: "";

    position: absolute;

    width: 78%;

    height: 78%;

    left: 11%;

    top: 11%;

    border-radius: 50%;

    background: #f8f4ec;

}



/* =========================================================
   CONTEÚDO MOBILE
   ========================================================= */

.chart-mobile .chart-content {

    position: relative;

    z-index: 2;

    width: 100%;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}



/* =========================================================
   PERCENTUAL MOBILE
   ========================================================= */

.chart-mobile .chart-percent {

    color: #00583f;

    font-size: 10vw;

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -0.04em;

    white-space: nowrap;

}



/* =========================================================
   TEXTO MOBILE
   ========================================================= */

.chart-mobile .chart-label {

    margin-top: 3%;

    color: #d85b00;

    font-size: 4vw;

    line-height: 1;

    font-weight: 800;

    white-space: nowrap;

}



/* =========================================================
   ATIVAÇÃO MOBILE
   ========================================================= */

@media (max-width: 768px) {


    /*
       DESKTOP DESLIGADO
    */

    .pagina {

        display: none;

    }


    /*
       MOBILE LIGADO
    */

    .mobile-page {

        display: block;

    }

}



/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 769px) {


    .pagina {

        display: block;

    }


    .mobile-page {

        display: none;

    }

}



/* =========================================================
   CELULARES PEQUENOS
   ========================================================= */

@media (max-width: 430px) {


    .chart-mobile {

        /*
           Mantém o gráfico proporcional.
        */

        width: 43vw;

        /*
           Mais abaixo para não encostar
           no título.
        */

        top: 57%;

    }


    .chart-mobile .chart-percent {

        font-size: 10vw;

    }


    .chart-mobile .chart-label {

        font-size: 4vw;

    }

}



</style>

</head>



<body>



<!-- =======================================================
     DESKTOP
     ======================================================= -->

<main class="pagina">


    <section
        class="grafico"
        id="grafico"
        aria-label="Progresso da campanha"
    >


        <div
            class="circulo"
            id="circulo"
        ></div>


        <div class="conteudo-grafico">


            <div
                class="percentual"
                id="percentual"
            >
                11,8%
            </div>


            <div class="subtitulo">

                DA NOSSA META

            </div>


        </div>


    </section>


</main>



<!-- =======================================================
     MOBILE
     ======================================================= -->

<div class="mobile-page">


    <!-- ===================================================
         ARTE VERTICAL
         =================================================== -->

    <img
        src="V5-CELULAR.png"
        alt="Campanha de doação de ração"
    >



    <!-- ===================================================
         GRÁFICO MOBILE
         =================================================== -->

    <div
        class="chart-mobile"
        id="chartMobile"
    >


        <div class="chart-ring"></div>


        <div class="chart-content">


            <div
                class="chart-percent"
                id="percentMobile"
            >
                11,8%
            </div>


            <div
                class="chart-label"
            >
                DA NOSSA META
            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   CONFIGURAÇÃO DA CAMPANHA
   ========================================================= */


const META = 1000;


let arrecadado = 118;



/* =========================================================
   ATUALIZA GRÁFICOS
   ========================================================= */

function atualizarGrafico() {


    let percentual =
        (arrecadado / META) * 100;


    /*
       Nunca ultrapassar 100%.
    */

    percentual =
        Math.max(
            0,
            Math.min(
                percentual,
                100
            )
        );


    /*
       Converte percentual
       para graus.
    */

    const graus =
        percentual * 3.6;


    /*
       Formatação brasileira.
    */

    const percentualTexto =

        percentual.toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }
        ) + "%";



    /* =====================================================
       DESKTOP
       ===================================================== */


    const circulo =
        document.getElementById(
            "circulo"
        );


    const percentualElemento =
        document.getElementById(
            "percentual"
        );


    if (circulo) {

        circulo.style.setProperty(

            "--progresso",

            graus + "deg"

        );

    }


    if (percentualElemento) {

        percentualElemento.textContent =
            percentualTexto;

    }



    /* =====================================================
       MOBILE
       ===================================================== */


    const chartMobile =
        document.getElementById(
            "chartMobile"
        );


    const percentMobile =
        document.getElementById(
            "percentMobile"
        );


    if (chartMobile) {

        chartMobile.style.setProperty(

            "--progress",

            graus + "deg"

        );

    }


    if (percentMobile) {

        percentMobile.textContent =
            percentualTexto;

    }

}



/* =========================================================
   INICIALIZA
   ========================================================= */

atualizarGrafico();


</script>


</body>

</html>
