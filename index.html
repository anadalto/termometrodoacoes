<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Termômetro de Doação</title>


<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #f7f3eb;

}


/* =========================================================
   PÁGINA
   ========================================================= */

.pagina {

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

}


/* =========================================================
   IMAGEM BASE
   ========================================================= */

.imagem-base {

    position: absolute;

    inset: 0;

    width: 100vw;

    height: 100vh;

    display: block;

    object-fit: contain;

}


/* =========================================================
   GRÁFICO DINÂMICO
   =========================================================

   O gráfico fica exatamente no espaço vazio
   deixado na arte V5-BASE.

   ========================================================= */

.grafico {

    position: absolute;

    left: 74.5%;

    top: 45%;

    width: 20vw;

    aspect-ratio: 1 / 1;

    transform: translate(-50%, -50%);

}


/* =========================================================
   DONUT
   ========================================================= */

.donut {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:

        conic-gradient(

            #004d2d 0deg,

            #004d2d 42.48deg,

            #e7dfd3 42.48deg,

            #e7dfd3 360deg

        );

}


/* =========================================================
   CENTRO DO DONUT
   ========================================================= */

.donut::after {

    content: "";

    position: absolute;

    left: 12%;

    top: 12%;

    width: 76%;

    height: 76%;

    border-radius: 50%;

    background: #f7f3eb;

}


/* =========================================================
   PERCENTUAL
   ========================================================= */

.percentual {

    position: absolute;

    z-index: 5;

    left: 50%;

    top: 45%;

    transform:
        translate(-50%, -50%);

    color: #004d2d;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 3.5vw;

    font-weight: 900;

    line-height: 1;

    white-space: nowrap;

}


/* =========================================================
   LEGENDA
   ========================================================= */

.legenda {

    position: absolute;

    z-index: 5;

    left: 50%;

    top: 67%;

    transform:
        translateX(-50%);

    color: #d85b00;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 1.05vw;

    font-weight: 900;

    white-space: nowrap;

}


/* =========================================================
   ANIMAÇÃO
   ========================================================= */

.donut {

    transition:
        background 1.5s ease;

}


.percentual {

    transition:
        opacity 0.5s ease;

}


/* =========================================================
   SEGURANÇA
   ========================================================= */

body {

    user-select: none;

}


/* =========================================================
   AJUSTE PARA TELAS MENORES
   ========================================================= */

@media (max-width: 900px) {

    .percentual {

        font-size: 6vw;

    }

    .legenda {

        font-size: 1.8vw;

    }

}

</style>

</head>



<body>


<div class="pagina">


    <!-- =====================================================
         IMAGEM FIXA DA CAMPANHA
         ===================================================== -->

    <img
        src="V5-BASE.png"
        class="imagem-base"
        alt="Termômetro de Doação"
    >


    <!-- =====================================================
         GRÁFICO DINÂMICO
         ===================================================== -->

    <div
        class="grafico"
        id="grafico"
    >

        <div
            class="donut"
            id="donut"
        ></div>


        <div
            class="percentual"
            id="percentual"
        >

            11,8%

        </div>


        <div
            class="legenda"
        >

            DA NOSSA META

        </div>

    </div>


</div>



<script>


/* =========================================================
   =========================================================

   ⭐⭐⭐ ATUALIZE SOMENTE ESTE NÚMERO ⭐⭐⭐

   Quantidade de ração arrecadada:

   ========================================================= */

const kgArrecadados = 118;


/* =========================================================
   META DA CAMPANHA
   ========================================================= */

const meta = 1000;


/* =========================================================
   CALCULA O PERCENTUAL
   ========================================================= */

let percentual =
    (kgArrecadados / meta) * 100;


/* =========================================================
   NÃO DEIXA PASSAR DE 100%
   ========================================================= */

if (percentual > 100) {

    percentual = 100;

}


/* =========================================================
   FORMATA O PERCENTUAL
   ========================================================= */

const percentualFormatado =

    percentual
        .toFixed(1)
        .replace(".", ",");


/* =========================================================
   COLOCA O PERCENTUAL NA TELA
   ========================================================= */

document
    .getElementById("percentual")
    .textContent =
        percentualFormatado + "%";


/* =========================================================
   TRANSFORMA O PERCENTUAL EM GRAUS
   ========================================================= */

const graus =
    percentual * 3.6;


/* =========================================================
   ATUALIZA O DONUT
   ========================================================= */

document
    .getElementById("donut")
    .style.background =

    `conic-gradient(

        #004d2d 0deg,

        #004d2d ${graus}deg,

        #e7dfd3 ${graus}deg,

        #e7dfd3 360deg

    )`;


</script>


</body>

</html>
