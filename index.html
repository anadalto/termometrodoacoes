<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Termômetro de Doação</title>


    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;

            background: #f7f3eb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            overflow-x: hidden;
        }


        /* =====================================================
           PÁGINA
           ===================================================== */

        .page {

            position: relative;

            width: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #f7f3eb;
        }


        /* =====================================================
           ARTE DESKTOP
           ===================================================== */

        .background {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            z-index: 1;
        }


        /* =====================================================
           ÁREA DO GRÁFICO
           ===================================================== */

        .chart-area {

            position: absolute;

            z-index: 20;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        /* =====================================================
           GRÁFICO CIRCULAR
           ===================================================== */

        .progress-ring {

            position: relative;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                conic-gradient(
                    #005238 0deg,
                    #005238 var(--progress-angle),
                    #e5dfd4 var(--progress-angle),
                    #e5dfd4 360deg
                );

            filter:
                drop-shadow(
                    0 8px 15px
                    rgba(0,0,0,0.08)
                );
        }


        /* =====================================================
           BURACO CENTRAL
           ===================================================== */

        .progress-ring::before {

            content: "";

            position: absolute;

            width: 76%;
            height: 76%;

            border-radius: 50%;

            background: #f7f3eb;

            z-index: 1;
        }


        /* =====================================================
           CONTEÚDO DO GRÁFICO
           ===================================================== */

        .progress-content {

            position: absolute;

            z-index: 2;

            width: 70%;
            height: 70%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            line-height: 1;
        }


        /* =====================================================
           PERCENTUAL
           ===================================================== */

        .percent {

            color: #005238;

            font-size: 15%;

            font-weight: 900;

            line-height: 1;

            white-space: nowrap;

            letter-spacing: -1px;
        }


        /* =====================================================
           TEXTO DA META
           ===================================================== */

        .percent-label {

            margin-top: 7%;

            color: #d85b00;

            font-size: 5.2%;

            font-weight: 900;

            line-height: 1.1;

            white-space: nowrap;

            text-transform: uppercase;
        }


        /* =====================================================
           =====================================================
           DESKTOP
           =====================================================
           ===================================================== */

        @media (min-width: 601px) {


            /*
               =================================================
               PROPORÇÃO DA SUA ARTE ATUAL
               =================================================

               V5-BASE.png
               1536 x 1024
            */

            .page {

                width: 100%;

                aspect-ratio: 1536 / 1024;

                height: auto;

                min-height: 0;

                position: relative;

                overflow: hidden;
            }


            /*
               =================================================
               ARTE DESKTOP
               =================================================
            */

            .background {

                display: block;

                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                object-fit: fill;

                object-position: center;

                z-index: 1;
            }


            /*
               =================================================
               GRÁFICO DESKTOP — V8
               =================================================

               POSIÇÃO ORIGINAL DA V8

               left: 72%
               top: 52%
               width: 29%
            */

            .chart-area {

                left: 72%;

                top: 52%;

                width: 29%;

                aspect-ratio: 1 / 1;

                height: auto;

                transform:
                    translate(-50%, -50%);

                display: flex;

                align-items: center;

                justify-content: center;

                text-align: center;
            }


            /*
               =================================================
               GRÁFICO
               =================================================
            */

            .progress-ring {

                width: 100%;
                height: 100%;

                border-radius: 50%;

                display: flex;

                align-items: center;
                justify-content: center;

                background:
                    conic-gradient(
                        #005238 0deg,
                        #005238 var(--progress-angle),
                        #e5dfd4 var(--progress-angle),
                        #e5dfd4 360deg
                    );

                filter:
                    drop-shadow(
                        0 8px 15px
                        rgba(0,0,0,0.08)
                    );
            }


            /*
               =================================================
               BURACO CENTRAL — V8
               =================================================
            */

            .progress-ring::before {

                content: "";

                position: absolute;

                width: 76%;
                height: 76%;

                border-radius: 50%;

                background: #f7f3eb;

                z-index: 1;
            }


            /*
               =================================================
               CONTEÚDO — V8
               =================================================
            */

            .progress-content {

                position: absolute;

                z-index: 2;

                width: 70%;
                height: 70%;

                display: flex;

                flex-direction: column;

                align-items: center;
                justify-content: center;

                text-align: center;

                line-height: 1;
            }


            /*
               =================================================
               PERCENTUAL — V8
               =================================================

               15% do tamanho do gráfico
            */

            .percent {

                color: #005238;

                font-size: 15%;

                font-weight: 900;

                line-height: 1;

                white-space: nowrap;

                letter-spacing: -1px;
            }


            /*
               =================================================
               LEGENDA — V8
               =================================================

               5.2% do tamanho do gráfico
            */

            .percent-label {

                margin-top: 7%;

                color: #d85b00;

                font-size: 5.2%;

                font-weight: 900;

                line-height: 1.1;

                white-space: nowrap;

                text-transform: uppercase;
            }

        }


        /* =====================================================
           =====================================================
           CELULAR
           =====================================================
           ===================================================== */

        @media (max-width: 600px) {


            /*
               =================================================
               PÁGINA VERTICAL
               =================================================

               V5-CELULAR.png
               1536 x 2048
            */

            .page {

                width: 100%;

                aspect-ratio: 1536 / 2048;

                height: auto;

                min-height: 0;

                position: relative;

                overflow: hidden;

                background-color: #f7f3eb;

                background-image:
                    url("V5-CELULAR.png");

                background-repeat: no-repeat;

                background-position: center top;

                background-size: 100% 100%;
            }


            /*
               ESCONDE A ARTE DESKTOP
            */

            .background {

                display: none;
            }


            /*
               =================================================
               GRÁFICO MOBILE
               =================================================

               ESTA É A CONFIGURAÇÃO QUE VOCÊ DISSE
               QUE FICOU BOA.

               NÃO MEXER.
            */

            .chart-area {

                position: absolute;

                width: 100%;

                height: auto;

                left: 50%;

                top: 68%;

                transform:
                    translate(-50%, -50%);

                display: flex;

                align-items: center;

                justify-content: center;

                z-index: 20;
            }


            /*
               =================================================
               TAMANHO MOBILE
               =================================================
            */

            .progress-ring {

                width: 42vw;

                height: 42vw;

                max-width: 250px;
                max-height: 250px;

                min-width: 150px;
                min-height: 150px;

                border-radius: 50%;

                display: flex;

                align-items: center;
                justify-content: center;

                background:
                    conic-gradient(
                        #005238 0deg,
                        #005238 var(--progress-angle),
                        #e5dfd4 var(--progress-angle),
                        #e5dfd4 360deg
                    );

                filter:
                    drop-shadow(
                        0 8px 15px
                        rgba(0,0,0,0.08)
                    );
            }


            /*
               =================================================
               BURACO CENTRAL MOBILE
               =================================================
            */

            .progress-ring::before {

                content: "";

                position: absolute;

                width: 82%;
                height: 82%;

                border-radius: 50%;

                background: #f7f3eb;

                z-index: 1;
            }


            /*
               =================================================
               CONTEÚDO MOBILE
               =================================================
            */

            .progress-content {

                position: absolute;

                z-index: 2;

                width: 70%;
                height: 70%;

                display: flex;

                flex-direction: column;

                align-items: center;
                justify-content: center;

                text-align: center;

                line-height: 1;
            }


            /*
               =================================================
               PERCENTUAL MOBILE
               =================================================
            */

            .percent {

                font-size: 9vw;

                font-weight: 900;

                color: #005238;

                line-height: 1;

                letter-spacing: -1px;

                white-space: nowrap;
            }


            /*
               =================================================
               LEGENDA MOBILE
               =================================================
            */

            .percent-label {

                margin-top: 4%;

                font-size: 3.2vw;

                font-weight: 800;

                color: #d85b00;

                line-height: 1.1;

                text-transform: uppercase;

                white-space: nowrap;
            }

        }


        /* =====================================================
           CELULARES PEQUENOS
           ===================================================== */

        @media (max-width: 380px) {


            .chart-area {

                top: 69%;
            }


            .progress-ring {

                width: 43vw;

                height: 43vw;

                min-width: 145px;

                min-height: 145px;
            }


            .percent {

                font-size: 9vw;
            }


            .percent-label {

                font-size: 3.3vw;
            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         PÁGINA
         ===================================================== -->

    <div class="page">


        <!-- =================================================
             ARTE DESKTOP
             ================================================= -->

        <img
            class="background"
            src="V5-BASE.png"
            alt="Campanha de doação de ração"
        >


        <!-- =================================================
             GRÁFICO DINÂMICO
             ================================================= -->

        <div
            class="chart-area"
            id="chartArea"
        >

            <div
                class="progress-ring"
                id="progressRing"
            >

                <div
                    class="progress-content"
                >

                    <div
                        class="percent"
                        id="percent"
                    >
                        11,8%
                    </div>


                    <div
                        class="percent-label"
                    >
                        DA NOSSA META
                    </div>

                </div>

            </div>

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           DADOS DA CAMPANHA
           ===================================================== */


        /*
           =====================================================
           ALTERE SOMENTE ESTE NÚMERO
           =====================================================

           Atualmente:
           118 KG

           Quando arrecadar mais, altere somente:

           const arrecadado = 118;

           Exemplo:

           200 KG
           const arrecadado = 200;

           350 KG
           const arrecadado = 350;

           500 KG
           const arrecadado = 500;
        */

        const arrecadado = 118;


        /*
           =====================================================
           META
           =====================================================
        */

        const meta = 1000;


        /* =====================================================
           CALCULA O PERCENTUAL
           ===================================================== */

        let percentual =
            (arrecadado / meta) * 100;


        /*
           Não permite ultrapassar 100%
        */

        if (percentual > 100) {

            percentual = 100;

        }


        /*
           Não permite valor negativo
        */

        if (percentual < 0) {

            percentual = 0;

        }


        /* =====================================================
           ELEMENTOS
           ===================================================== */

        const progressRing =
            document.getElementById(
                "progressRing"
            );


        const percentElement =
            document.getElementById(
                "percent"
            );


        /* =====================================================
           ANIMAÇÃO
           ===================================================== */

        const duracao = 1800;

        const inicio =
            performance.now();


        function animarGrafico(tempoAtual) {


            /*
               Tempo decorrido
            */

            const tempoDecorrido =
                tempoAtual - inicio;


            /*
               Percentual da animação
            */

            let progressoAnimacao =
                tempoDecorrido / duracao;


            /*
               Limita entre 0 e 1
            */

            if (progressoAnimacao > 1) {

                progressoAnimacao = 1;

            }


            /*
               Easing suave
            */

            const suavizado =
                1 -
                Math.pow(
                    1 - progressoAnimacao,
                    3
                );


            /*
               Valor atual
            */

            const valorAtual =
                percentual * suavizado;


            /*
               Converte percentual
               em graus.

               100% = 360°
            */

            const angulo =
                valorAtual * 3.6;


            /*
               Atualiza o círculo
            */

            progressRing.style.setProperty(
                "--progress-angle",
                angulo + "deg"
            );


            /*
               Atualiza o texto
            */

            percentElement.textContent =
                valorAtual
                    .toFixed(1)
                    .replace(".", ",")
                + "%";


            /*
               Continua a animação
            */

            if (progressoAnimacao < 1) {

                requestAnimationFrame(
                    animarGrafico
                );

            }


            /*
               Garante o valor final
            */

            else {

                percentElement.textContent =
                    percentual
                        .toFixed(1)
                        .replace(".", ",")
                    + "%";

            }

        }


        /* =====================================================
           INICIA
           ===================================================== */

        requestAnimationFrame(
            animarGrafico
        );


    </script>


</body>

</html>
